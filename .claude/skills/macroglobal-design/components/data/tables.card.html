<!-- @dsCard group="Components" viewport="900x520" name="DataTable + StatCard + Stepper" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  body { margin: 0; font-family: var(--mg-font-sans); background: var(--mg-surface-page); color: var(--mg-text-primary); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 22px; }
  .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mg-text-muted); font-weight: 600; margin-bottom: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .panel { background: var(--mg-surface-card); border: 1px solid var(--mg-border-default); border-radius: var(--mg-radius-lg); padding: 20px 18px; box-shadow: var(--mg-shadow-sm); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DataTable, StatCard, Stepper, Tag, Avatar } = window.MACROGlobalCRMDesignSystem_2f42e6;
  const rows = [
    { id: 1, name: 'Богдан Ядыкин', ini: 'БЯ', obj: 'City Park · 2к', sum: '2 950 000', mgr: 'Школьник', st: ['info','Сделка'] },
    { id: 2, name: 'Kevin Hapkins', ini: 'KH', obj: 'City Park', sum: '1 240 000', mgr: 'Орлов', st: ['secondary','Прозвон'] },
    { id: 3, name: 'Олег Лебедев', ini: 'ОЛ', obj: 'Корпус 6 · 1к', sum: '3 970 000', mgr: 'Builkov', st: ['warning','Бронь'] },
    { id: 4, name: 'Клим Сотов', ini: 'КС', obj: '2к · 94 м²', sum: '2 930 000', mgr: 'Школьник', st: ['success','Завершена'] },
  ];
  function Demo() {
    const [sel, setSel] = React.useState([1]);
    const [sk, setSk] = React.useState('sum');
    const cols = [
      { key: 'name', label: 'Лид', sortable: true, render: (r) => <span style={{display:'inline-flex',alignItems:'center',gap:'10px'}}><Avatar name={r.name} size={28} />{r.name}</span> },
      { key: 'obj', label: 'Объект', render: (r) => <span style={{color:'var(--mg-text-secondary)'}}>{r.obj}</span> },
      { key: 'sum', label: 'Сумма', align: 'end', sortable: true, render: (r) => <span className="mg-tnum" style={{fontWeight:600}}>{r.sum} ₸</span> },
      { key: 'mgr', label: 'Менеджер', render: (r) => <span style={{color:'var(--mg-text-secondary)'}}>{r.mgr}</span> },
      { key: 'st', label: 'Статус', render: (r) => <Tag sev={r.st[0]}>{r.st[1]}</Tag> },
    ];
    return (
      <div className="wrap">
        <div>
          <div className="cap">StatCard — board KPIs</div>
          <div className="kpis">
            <StatCard label="Выручка" value="114 млн ₸" icon="pi-wallet" delta="+8%" />
            <StatCard label="Конверсия" value="24%" icon="pi-chart-line" delta="+3%" tone="success" />
            <StatCard label="Застряло" value="7" icon="pi-clock" delta="+2" deltaDir="down" tone="warning" />
            <StatCard label="Просрочено" value="3" icon="pi-exclamation-circle" tone="danger" />
          </div>
        </div>
        <div>
          <div className="cap">Stepper — шаги сделки</div>
          <div className="panel"><Stepper steps={[
            {label:'Стороны и доли',status:'done'},
            {label:'Цена договора',status:'done'},
            {label:'График платежей',sub:'на согласовании',status:'current'},
            {label:'Договор',status:'todo'},
            {label:'Регистрация',status:'todo'},
          ]} /></div>
        </div>
        <div>
          <div className="cap">DataTable — selectable, sortable</div>
          <DataTable columns={cols} rows={rows} selectable selected={sel}
            onToggle={(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id])}
            onToggleAll={()=>setSel(s=>s.length===rows.length?[]:rows.map(r=>r.id))}
            sortKey={sk} sortDir="desc" onSort={setSk} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
