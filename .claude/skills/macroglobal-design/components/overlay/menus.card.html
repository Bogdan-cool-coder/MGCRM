<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  body { margin: 0; font-family: var(--mg-font-sans); background: var(--mg-surface-page); color: var(--mg-text-primary); }
  .wrap { padding: 24px; display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mg-text-muted); font-weight: 600; margin-bottom: 12px; }
  .dlg { position: relative; width: 340px; height: 300px; border: 1px solid var(--mg-border-default); border-radius: var(--mg-radius-lg); overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Menu, Tooltip, Dialog, Button } = window.MACROGlobalCRMDesignSystem_2f42e6;
  function Demo() {
    return (
      <div className="wrap">
        <div>
          <div className="cap">Menu</div>
          <div style={{position:'relative',width:210,height:230}}>
            <Menu align="start" top="0" items={[
              {icon:'pi-pencil',label:'Редактировать'},
              {icon:'pi-check-circle',label:'Выполнить'},
              {icon:'pi-bookmark-fill',label:'Закрепить'},
              {sep:true},
              {icon:'pi-trash',label:'Удалить',danger:true},
            ]} />
          </div>
        </div>
        <div>
          <div className="cap">Tooltip</div>
          <div style={{display:'flex',gap:'12px',paddingTop:'20px'}}>
            <Tooltip label="Позвонить"><span style={{width:36,height:36,borderRadius:'var(--mg-radius-md)',border:'1px solid var(--mg-border-default)',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'var(--mg-text-secondary)'}}><i className="pi pi-phone" /></span></Tooltip>
            <Tooltip label="Написать письмо"><span style={{width:36,height:36,borderRadius:'var(--mg-radius-md)',border:'1px solid var(--mg-border-default)',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'var(--mg-text-secondary)'}}><i className="pi pi-envelope" /></span></Tooltip>
            <Tooltip label="Ещё действия" placement="bottom"><span style={{width:36,height:36,borderRadius:'var(--mg-radius-md)',border:'1px solid var(--mg-border-default)',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'var(--mg-text-secondary)'}}><i className="pi pi-ellipsis-h" /></span></Tooltip>
          </div>
        </div>
        <div>
          <div className="cap">Dialog</div>
          <div className="dlg">
            <Dialog title="Подтвердите перевод" onClose={()=>{}} width={300}
              footer={<><Button variant="secondary">Отмена</Button><Button variant="primary">Перевести</Button></>}
              style={{position:'absolute'}}>
              Перевести лид в стадию «Сделка в работе»? Будет создана сделка.
            </Dialog>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
