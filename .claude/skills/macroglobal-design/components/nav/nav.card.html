<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  body { margin: 0; font-family: var(--mg-font-sans); background: var(--mg-surface-page); color: var(--mg-text-primary); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 22px; }
  .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mg-text-muted); font-weight: 600; margin-bottom: 10px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tabs, SegmentedControl, Pagination } = window.MACROGlobalCRMDesignSystem_2f42e6;
  function Demo() {
    const [tab, setTab] = React.useState('fields');
    const [view, setView] = React.useState('kanban');
    const [scope, setScope] = React.useState('month');
    const [page, setPage] = React.useState(3);
    return (
      <div className="wrap">
        <div>
          <div className="cap">Tabs</div>
          <Tabs value={tab} onChange={setTab} items={[{key:'fields',label:'Поля'},{key:'steps',label:'Шаги сделки',count:4},{key:'chart',label:'График'},{key:'docs',label:'Документы',count:2}]} />
        </div>
        <div style={{display:'flex',gap:'28px',flexWrap:'wrap'}}>
          <div>
            <div className="cap">Segmented — view</div>
            <SegmentedControl value={view} onChange={setView} options={[{key:'kanban',icon:'pi-th-large'},{key:'list',icon:'pi-list'}]} />
          </div>
          <div>
            <div className="cap">Segmented — scope</div>
            <SegmentedControl value={scope} onChange={setScope} options={[{key:'day',label:'День'},{key:'week',label:'Неделя'},{key:'month',label:'Месяц'}]} />
          </div>
        </div>
        <div>
          <div className="cap">Pagination</div>
          <Pagination page={page} pageCount={12} onChange={setPage} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
