<!-- @dsCard group="CRM UI Kit" viewport="1440x820" name="CRM — Deals / Contacts / Tasks" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MACRO Global CRM — UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--mg-font-sans); background: var(--mg-surface-page); color: var(--mg-text-primary); -webkit-font-smoothing: antialiased; }
  #root { height: 100vh; }
  .mg-sb-scroll::-webkit-scrollbar { width: 0; }
  .mg-view-frame { width: 100%; height: 100%; border: 0; display: block; background: var(--mg-surface-page); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./Sidebar.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  // The three work surfaces ARE the current redesign prototypes — reused verbatim
  // (single source of truth). This kit only adds the brand-invariant navy app shell
  // (sidebar) around them. No top menu bar — the product has none; each surface
  // carries its own one-line toolbar.
  // NOTE (repo layout): the redesign mockups live at design-handoff/redesign/ in the
  // repo root, not inside this skill — hence the ../../../../../ hops (skill sits at
  // .claude/skills/macroglobal-design/). Kept as relative links to avoid duplicating
  // the mockups into the skill.
  const VIEWS = {
    deals:    '../../../../../design-handoff/redesign/sales-funnel.html',
    contacts: '../../../../../design-handoff/redesign/contacts.html',
    tasks:    '../../../../../design-handoff/redesign/tasks.html',
  };

  function App() {
    const [view, setView] = React.useState('deals');
    // Lazy-mount: only load an iframe once its surface has been opened; keep
    // already-loaded frames mounted (display toggle) so switching back is instant.
    const [loaded, setLoaded] = React.useState({ deals: true });

    const onNavigate = (k) => {
      const key = k === 'companies' ? 'contacts' : k;
      if (!VIEWS[key]) return;
      setView(key);
      setLoaded((l) => (l[key] ? l : { ...l, [key]: true }));
    };

    return (
      <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: 'var(--mg-surface-page)' }}>
        <window.Sidebar active={view} onNavigate={onNavigate} />
        <div style={{ position: 'relative', flex: 1, minWidth: 0 }}>
          {Object.keys(VIEWS).map((k) => (
            loaded[k] ? (
              <iframe
                key={k}
                src={VIEWS[k]}
                title={k}
                className="mg-view-frame"
                style={{ position: 'absolute', inset: 0, display: view === k ? 'block' : 'none' }}
              />
            ) : null
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
