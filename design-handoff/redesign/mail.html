/* ═══════════════════════════ filter bar ═══════════════════════════ */

function fmtD(d) { return d ? String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getFullYear()).slice(2) : ''; }
function DateRangePicker({ value, onChange }) {
  const [open, setOpen, ref] = usePop();
  const [view, setView] = useState(() => new Date(2026, 6, 1));
  const [hover, setHover] = useState(null);
  const range = value || [null, null];
  const pick = (day) => {
    const [s, e] = range;
    if (!s || (s && e)) { onChange([day, null]); }
    else if (day < s) { onChange([day, null]); }
    else { onChange([s, day]); setHover(null); setOpen(false); }
  };
  const y = view.getFullYear(), mo = view.getMonth();
  const first = new Date(y, mo, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const days = [];
  for (let i = 0; i < startOffset; i++) days.push(null);
  const dim = new Date(y, mo + 1, 0).getDate();
  for (let d = 1; d <= dim; d++) days.push(new Date(y, mo, d));
  /* во время выбора конца периода — динамичная подсветка по курсору */
  const s0 = range[0], e0 = range[1];
  const previewing = s0 && !e0 && hover && +hover >= +s0;
  const hi = e0 || (previewing ? hover : null);
  const inRange = (d) => { if (!d) return false; if (s0 && hi) return d >= s0 && d <= hi; return s0 && +d === +s0; };
  const isEnd = (d) => { if (!d) return false; if (+d === +s0) return true; if (e0 && +d === +e0) return true; if (previewing && +d === +hover) return true; return false; };
  const label = range[0] ? fmtD(range[0]) + (range[1] ? ' – ' + fmtD(range[1]) : ' – …') : 'Дата получения';
  return <div ref={ref} style={{ position: 'relative' }}>
    <div onClick={() => setOpen((o) => !o)} style={{ display: 'flex', alignItems: 'center', gap: '8px', height: 36, padding: '0 9px 0 11px', minWidth: 150,
      border: '1px solid ' + (open ? 'var(--mg-primary-900)' : 'var(--c-border2)'), borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)', cursor: 'pointer' }}>
      <i className="pi pi-calendar" style={{ fontSize: '13px', color: 'var(--c-muted)' }} />
      <span style={{ flex: 1, fontSize: '13px', color: range[0] ? 'var(--c-text)' : 'var(--c-muted)', whiteSpace: 'nowrap' }}>{label}</span>
      {range[0] ? <i className="pi pi-times" onClick={(e) => {e.stopPropagation();onChange(null);}} style={{ fontSize: '11px', color: 'var(--c-muted)', padding: '2px' }} /> : <i className="pi pi-chevron-down" style={{ fontSize: '10px', color: 'var(--c-muted)' }} />}
    </div>
    {open && <div style={{ position: 'absolute', bottom: 'calc(100% + 4px)', left: 0, zIndex: 70, width: 258, background: 'var(--c-card)', border: '1px solid var(--c-border)',
      borderRadius: 'var(--mg-radius-md)', boxShadow: 'var(--mg-shadow-lg)', padding: '10px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
        <button onClick={() => setView(new Date(y, mo - 1, 1))} style={{ width: 28, height: 28, borderRadius: 'var(--mg-radius-sm)', border: 'none', background: 'transparent', color: 'var(--c-text2)', cursor: 'pointer' }}><i className="pi pi-chevron-left" style={{ fontSize: '12px' }} /></button>
        <span style={{ fontSize: '13px', fontWeight: 600, color: 'var(--c-text)' }}>{RU_MONTHS[mo]} {y}</span>
        <button onClick={() => setView(new Date(y, mo + 1, 1))} style={{ width: 28, height: 28, borderRadius: 'var(--mg-radius-sm)', border: 'none', background: 'transparent', color: 'var(--c-text2)', cursor: 'pointer' }}><i className="pi pi-chevron-right" style={{ fontSize: '12px' }} /></button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px' }} onMouseLeave={() => setHover(null)}>
        {RU_WD.map((w) => <span key={w} style={{ textAlign: 'center', fontSize: '10px', fontWeight: 700, color: 'var(--c-muted)', padding: '2px 0' }}>{w}</span>)}
        {days.map((d, i) => { const sel = inRange(d); const end = isEnd(d);
          return <button key={i} disabled={!d} onClick={() => pick(d)} onMouseEnter={() => d && setHover(d)} style={{ height: 30, border: 'none', borderRadius: end ? 'var(--mg-radius-sm)' : sel ? 0 : 'var(--mg-radius-sm)',
            cursor: d ? 'pointer' : 'default', fontFamily: 'var(--mg-font-sans)', fontSize: '12px', fontWeight: end ? 700 : 500,
            background: end ? 'var(--mg-primary-900)' : sel ? 'var(--mg-primary-100)' : 'transparent', color: end ? '#fff' : d ? 'var(--c-text)' : 'transparent' }}>{d ? d.getDate() : ''}</button>; })}
      </div>
    </div>}

}

}

function SearchFilters({ f, setF, reset, active, counts }) {
  const [open, setOpen, ref] = usePop();
  const count = (f.view !== 'all' ? 1 : 0) + (f.date ? 1 : 0);
  const setView = (v) => setF({ view: v });
  const secLabel = (txt) => <div style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--c-muted)', margin: '2px 0 8px' }}>{txt}</div>;

        style={{ flex: 1, height: '100%', border: 'none', outline: 'none', background: 'transparent', padding: '0 10px', fontFamily: 'var(--mg-font-sans)', fontSize: '13px', color: 'var(--c-text)' }} />
      {f.q && <i className="pi pi-times" onClick={() => setF({ q: '' })} style={{ fontSize: '12px', color: 'var(--c-muted)', cursor: 'pointer', padding: '4px' }} />}
      <button onClick={() => setOpen((o) => !o)} title="Фильтры" style={{ position: 'relative', width: 30, height: 30, borderRadius: '50%', border: 'none', cursor: 'pointer',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: (open || count) ? 'var(--mg-primary-100)' : 'transparent', color: (open || count) ? 'var(--mg-primary-900)' : 'var(--c-muted)' }}>
        <i className="pi pi-sliders-h" style={{ fontSize: '14px' }} />

    </div>
    {open && <div style={{ position: 'absolute', top: 38, left: 0, right: 0, zIndex: 55, background: 'var(--c-card)', border: '1px solid var(--mg-primary-900)', borderTop: '1px solid var(--c-border)',
      borderRadius: '0 0 var(--mg-radius-md) var(--mg-radius-md)', boxShadow: 'var(--mg-shadow-lg)', padding: '14px 16px' }}>
      {secLabel('Папки')}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
        {FOLDERS.map(([id, ic, l]) => <FilterChip key={id} on={f.view === id} icon={ic} label={l} count={counts[id]} onClick={() => setView(id)} />)}
      </div>
      <div style={{ height: 1, background: 'var(--c-border)', margin: '14px 0' }} />
      {secLabel('Каналы')}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
        {CHANNEL_OPTS.map(([k, l]) => <FilterChip key={k} on={f.view === 'ch:' + k} icon={CHANNELS[k].icon} label={l} count={counts.ch[k]} onClick={() => setView('ch:' + k)} />)}
      </div>
      <div style={{ height: 1, background: 'var(--c-border)', margin: '14px 0' }} />
      <Field label="Дата получения"><DateRangePicker value={f.date} onChange={(v) => setF({ date: v })} /></Field>
      <div style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: '8px', marginTop: '8px', paddingTop: '12px', borderTop: '1px solid var(--c-border)' }}>
        {active && <button onClick={reset} style={{ height: 34, padding: '0 14px', borderRadius: 'var(--mg-radius-md)', border: 'none', background: 'transparent', color: 'var(--c-text2)',
          fontFamily: 'var(--mg-font-sans)', fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}>Сбросить фильтры</button>}
        <button onClick={() => setOpen(false)} style={{ height: 34, padding: '0 18px', borderRadius: 'var(--mg-radius-md)', border: 'none', background: 'var(--mg-primary-900)', color: '#fff',
          fontFamily: 'var(--mg-font-sans)', fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}>Готово</button>
      </div>
    </div>}
  </div>;
}

/* ═══════════════════════════ message row ═══════════════════════════ */
function MsgRow({ m, selected, cozy, starred, onStar, onOpen, onReprocess, pending }) {
  const [h, setH] = useState(false);
  const unread = !m.read;
  return <div onClick={() => onOpen(m)} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
  style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: cozy ? '14px 16px' : '11px 16px', cursor: 'pointer',
    borderLeft: '3px solid ' + (selected ? 'var(--mg-primary-900)' : 'transparent'),
    background: selected ? 'var(--c-sel)' : h ? 'var(--c-hover)' : 'transparent', borderBottom: '1px solid var(--c-border)' }}>
    <span style={{ width: 8, flexShrink: 0, display: 'flex', justifyContent: 'center' }}>
      {unread && <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--mg-primary-900)' }} />}</span>
    <button onClick={(e) => {e.stopPropagation();onStar(m.id);}} title={starred ? 'Снять отметку' : 'Пометить'} style={{ flexShrink: 0, width: 22, height: 22, border: 'none', background: 'transparent', cursor: 'pointer',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: starred ? 'var(--mg-stage-amber)' : 'var(--c-border2)' }}>
      <i className={'pi ' + (starred ? 'pi-star-fill' : 'pi-star')} style={{ fontSize: '14px' }} /></button>
    <ChannelDot ch={m.ch} size={cozy ? 38 : 34} />
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
        <span style={{ fontSize: '14px', fontWeight: unread ? 700 : 500, color: 'var(--c-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.fromName}</span>
        <span style={{ fontSize: '12px', color: 'var(--c-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{m.from}</span>
        <span style={{ fontSize: '12px', color: unread ? 'var(--mg-primary-900)' : 'var(--c-muted)', fontWeight: unread ? 600 : 400, whiteSpace: 'nowrap', flexShrink: 0 }}>{m.when}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '3px' }}>
        <span style={{ flex: 1, minWidth: 0, fontSize: '13px', color: 'var(--c-text2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {m.subject && <span style={{ fontWeight: unread ? 600 : 500, color: unread ? 'var(--c-text)' : 'var(--c-text2)' }}>{m.subject} · </span>}{m.body}</span>
        <DealChip m={m} onReprocess={onReprocess} pending={pending === m.id} />
      </div>
    </div>
  </div>;
}

/* ═══════════════════════════ reading pane ═══════════════════════════ */
function Meta({ label, children, mono }) {
  return <div style={{ display: 'flex', flexDirection: 'column', gap: '3px' }}>
    <span style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--c-muted)' }}>{label}</span>
    <span style={{ fontSize: '13px', color: 'var(--c-text)', fontFamily: mono ? 'var(--mg-font-mono, monospace)' : 'inherit', wordBreak: 'break-word' }}>{children}</span></div>;
}
function Reading({ m, admin, starred, onStar, onReprocess, pending, onToggleRead }) {
  const [rawOpen, setRawOpen] = useState(false);
  if (!m) return <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '12px', padding: '40px', textAlign: 'center' }}>
    <i className="pi pi-envelope" style={{ fontSize: '34px', color: 'var(--c-muted)', opacity: 0.5 }} />
    <span style={{ fontSize: '14px', fontWeight: 600, color: 'var(--c-text2)' }}>Выберите сообщение</span>
    <span style={{ fontSize: '13px', color: 'var(--c-muted)', maxWidth: 260 }}>Кликните письмо слева, чтобы прочитать его и разобрать в сделку</span></div>;
  const c = CHANNELS[m.ch];const s = STATUS[m.status];
  return <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    {/* toolbar */}
    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '14px 20px', borderBottom: '1px solid var(--c-border)' }}>
      <ChannelDot ch={m.ch} size={38} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: '15px', fontWeight: 700, color: 'var(--c-text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.fromName}</div>
        <div style={{ fontSize: '12px', color: 'var(--c-muted)' }}>{c.label} · #{m.id}</div>
      </div>
      <button onClick={() => onStar(m.id)} title={starred ? 'Снять отметку' : 'Пометить'} style={{ width: 32, height: 32, borderRadius: 'var(--mg-radius-md)', border: '1px solid var(--c-border2)',
        background: 'transparent', color: starred ? 'var(--mg-stage-amber)' : 'var(--c-muted)', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
        <i className={'pi ' + (starred ? 'pi-star-fill' : 'pi-star')} style={{ fontSize: '13px' }} /></button>
      <button onClick={() => onToggleRead(m.id)} title={m.read ? 'Отметить непрочитанным' : 'Отметить прочитанным'}
      style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', height: 32, padding: '0 11px', borderRadius: 'var(--mg-radius-md)', border: '1px solid var(--c-border2)',
        background: 'transparent', color: 'var(--c-text2)', fontFamily: 'var(--mg-font-sans)', fontSize: '12px', fontWeight: 600, cursor: 'pointer' }}>
        <i className={'pi ' + (m.read ? 'pi-envelope' : 'pi-envelope-open')} style={{ fontSize: '12px' }} />{m.read ? 'Непрочитано' : 'Прочитано'}</button>
    </div>
    <div style={{ flex: 1, overflowY: 'auto', padding: '18px 20px' }}>
      {m.status === 'failed' && <div style={{ display: 'flex', gap: '10px', alignItems: 'flex-start', padding: '11px 13px', marginBottom: '16px', borderRadius: 'var(--mg-radius-md)',
        background: 'var(--mg-red-50)', border: '1px solid var(--mg-red-300)' }}>
        <i className="pi pi-exclamation-triangle" style={{ fontSize: '15px', color: 'var(--mg-red-700)', marginTop: '1px' }} />
        <div style={{ flex: 1 }}><div style={{ fontSize: '13px', fontWeight: 600, color: 'var(--mg-red-700)' }}>Сообщение не разобрано автоматически</div>
          <div style={{ fontSize: '12px', color: 'var(--mg-red-700)', opacity: 0.85, marginTop: '2px' }}>Нажмите «Создать сделку» — система попытается создать сделку по этому сообщению.</div></div>
        <button onClick={() => onReprocess(m.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', height: 32, padding: '0 13px', borderRadius: 'var(--mg-radius-md)',
          border: 'none', background: 'var(--mg-red-600)', color: '#fff', fontFamily: 'var(--mg-font-sans)', fontSize: '12px', fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>
          <i className={'pi ' + (pending === m.id ? 'pi-spin pi-spinner' : 'pi-refresh')} style={{ fontSize: '11px' }} />Создать сделку</button></div>}
      {/* meta grid */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px 24px', padding: '2px 0 16px', borderBottom: '1px solid var(--c-border)' }}>
        <Meta label="Канал"><span style={{ display: 'inline-flex', alignItems: 'center', gap: '7px' }}><ChannelChip ch={m.ch} showLabel /> <span style={{ color: 'var(--c-muted)' }}>· {m.from}</span></span></Meta>
        <Meta label="Получено">{m.full}</Meta>
        <Meta label="От (имя)">{m.fromName}</Meta>
        <Meta label="От (идентификатор)" mono>{m.from}</Meta>
        <Meta label="Статус маршрутизации"><Tag sev={s.sev}>{s.label}</Tag></Meta>
        <Meta label="Сделка">{m.deal ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: '5px', color: 'var(--mg-primary-900)', fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}>
          <i className={'pi ' + (m.status === 'dedup' ? 'pi-link' : 'pi-briefcase')} style={{ fontSize: '12px' }} />Сделка #{m.deal}
          {m.created ? <i className="pi pi-check-circle" title="Создана этим сообщением" style={{ fontSize: '12px', color: 'var(--mg-green-700)' }} /> : null}</span> :
          <span style={{ color: 'var(--c-muted)' }}>не привязана</span>}</Meta>
      </div>
      {m.subject && <div style={{ marginTop: '16px' }}>
        <div style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--c-muted)', marginBottom: '5px' }}>Тема</div>
        <div style={{ fontSize: '16px', fontWeight: 600, color: 'var(--c-text)' }}>{m.subject}</div></div>}
      <div style={{ marginTop: '16px' }}>
        <div style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--c-muted)', marginBottom: '6px' }}>Текст сообщения</div>
        <div style={{ fontSize: '14px', lineHeight: 1.6, color: 'var(--c-text)', whiteSpace: 'pre-line' }}>{m.body}</div></div>
      {admin && m.raw && <div style={{ marginTop: '18px', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-md)', overflow: 'hidden' }}>
        <button onClick={() => setRawOpen((o) => !o)} style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', padding: '10px 13px', background: 'var(--c-hover)',
          border: 'none', cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: '12px', fontWeight: 600, color: 'var(--c-text2)' }}>
          <i className={'pi ' + (rawOpen ? 'pi-chevron-down' : 'pi-chevron-right')} style={{ fontSize: '11px' }} />Raw payload</button>
        {rawOpen && <pre style={{ margin: 0, padding: '12px 14px', fontSize: '12px', color: 'var(--c-text2)', fontFamily: 'var(--mg-font-mono, monospace)', whiteSpace: 'pre-wrap', wordBreak: 'break-word', background: 'var(--c-card)' }}>
          {JSON.stringify(m.raw, null, 2)}</pre>}</div>}
    </div>
  </div>;
}

/* ═══════════════════════════ app ═══════════════════════════ */
const TWEAK_DEFAULTS = { accent: '#172747', dark: false, density: 'Обычная', admin: true, empty: false };
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [f, setFf] = useState({ unread: true, q: '', date: null, view: 'all' });
  const setF = (patch) => setFf((s) => ({ ...s, ...patch }));
  const [reads, setReads] = useState(() => Object.fromEntries(MSGS.map((m) => [m.id, m.read])));
  const [stars, setStars] = useState({ 5011: true, 5008: true });
  const [sel, setSel] = useState(null);
  const [pending, setPending] = useState(null);
  const [toast, setToast] = useState(null);
  const dark = t.dark;
  const ACC = { '#172747': '#1f2f5a', '#2b2f36': '#3a3f47', '#312e81': '#3f3a9e', '#0f4d3a': '#13654c' };
  const accent = dark ? '#4C7DF0' : t.accent;
  const accentHover = dark ? '#6E99FF' : ACC[t.accent] || '#1f2f5a';
  const cozy = t.density === 'Просторная';

  const list = useMemo(() => MSGS.map((m) => ({ ...m, read: reads[m.id] })).filter((m) => {
    const V = f.view, b = boxOf(m.id), deal = (m.status === 'routed' || m.status === 'dedup');
    if (V === 'all') {if (b !== 'inbox') return false;}
    else if (V === 'starred') {if (!stars[m.id] || b === 'trash') return false;}
    else if (V === 'important') {if (!IMPORTANT[m.id] || b !== 'inbox') return false;}
    else if (V === 'failed') {if (m.status !== 'failed' || b !== 'inbox') return false;}
    else if (V === 'deals') {if (!deal || b === 'trash') return false;}
    else if (V === 'snoozed') {if (b !== 'snoozed') return false;}
    else if (V === 'sent') {if (b !== 'sent') return false;}
    else if (V === 'drafts') {if (b !== 'drafts') return false;}
    else if (V === 'allmail') {if (b === 'trash') return false;}
    else if (V === 'spam') {if (b !== 'spam') return false;}
    else if (V === 'trash') {if (b !== 'trash') return false;}
    else if (V.startsWith('ch:')) {if (m.ch !== V.slice(3) || b !== 'inbox') return false;}
    const boxView = V === 'spam' || V === 'trash' || V === 'snoozed' || V === 'sent' || V === 'drafts' || V === 'allmail';
    if (f.unread && m.read && !boxView) return false;
    if (f.q) {const q = f.q.toLowerCase();if (!(m.fromName + m.from + (m.subject || '') + m.body).toLowerCase().includes(q)) return false;}
    return true;
  }), [f, reads, stars]);
  const counts = useMemo(() => {
    const un = (m) => !reads[m.id];
    const c = { all: 0, starred: 0, important: 0, failed: 0, deals: 0, snoozed: 0, sent: 0, drafts: 0, allmail: 0, spam: 0, trash: 0, ch: {} };
    CHANNEL_OPTS.forEach(([k]) => c.ch[k] = 0);
    MSGS.forEach((m) => {
      const b = boxOf(m.id), u = un(m), deal = (m.status === 'routed' || m.status === 'dedup');
      if (b === 'inbox' && u) c.all++;
      if (stars[m.id] && b !== 'trash' && u) c.starred++;
      if (IMPORTANT[m.id] && b === 'inbox' && u) c.important++;
      if (m.status === 'failed' && b === 'inbox') c.failed++;
      if (deal && b !== 'trash' && u) c.deals++;
      if (b === 'snoozed') c.snoozed++;
      if (b === 'sent') c.sent++;
      if (b === 'drafts') c.drafts++;
      if (b !== 'trash' && u) c.allmail++;
      if (b === 'spam') c.spam++;
      if (b === 'trash') c.trash++;
      if (b === 'inbox' && u) c.ch[m.ch]++;
    });
    return c;
  }, [reads, stars]);
  const unreadCount = MSGS.filter((m) => !reads[m.id]).length;
  const active = f.view !== 'all' || f.q || f.date || !f.unread;
  const selMsg = sel ? { ...MSGS.find((m) => m.id === sel), read: reads[sel] } : null;
  const empty = t.empty || list.length === 0;

  const openMsg = (m) => {setSel(m.id);setReads((r) => ({ ...r, [m.id]: true }));};
  const toggleRead = (id) => setReads((r) => ({ ...r, [id]: !r[id] }));
  const toggleStar = (id) => setStars((s) => ({ ...s, [id]: !s[id] }));
  const reset = () => setF({ unread: true, q: '', date: null, view: 'all' });
  const reprocess = (id) => {setPending(id);setTimeout(() => {setPending(null);flash('Сообщение разобрано. Сделка #48' + (30 + id % 9) + ' создана.');}, 1100);};
  function flash(msg) {setToast(msg);setTimeout(() => setToast(null), 2600);}

  return <div className={'surface' + (dark ? ' dark' : '')} style={{ '--mg-primary-900': accent, '--mg-primary-800': accentHover,
    height: '100vh', display: 'flex', flexDirection: 'column', position: 'relative', background: 'var(--c-board)' }}>
    {/* header */}
    <header style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '14px 22px', borderBottom: '1px solid var(--c-border)', background: 'var(--c-card)', flexShrink: 0, flexWrap: 'wrap' }}>
      <span style={{ width: 38, height: 38, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        <i className="pi pi-envelope" style={{ fontSize: '17px', color: 'var(--mg-primary-900)' }} /></span>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
        <h1 style={{ fontSize: '19px', fontWeight: 600, color: 'var(--c-text)', margin: 0, lineHeight: 1.1 }}>Почта</h1>
        {unreadCount > 0 && <span style={{ fontSize: '12px', fontWeight: 700, color: '#fff', background: 'var(--mg-red-600)', borderRadius: '999px', padding: '2px 8px', minWidth: 22, textAlign: 'center' }}>{unreadCount}</span>}
      </div>
      <span style={{ display: 'inline-flex', gap: '2px', background: 'var(--mg-gray-100)', borderRadius: '9px', padding: '3px', flexShrink: 0 }}>
        {[[true, 'Непрочитанные'], [false, 'Все']].map(([v, l]) => {const on = f.unread === v;return <button key={l} onClick={() => setF({ unread: v })}
          style={{ border: 'none', cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: '13px', fontWeight: 600, padding: '6px 13px', borderRadius: '6px',
            background: on ? 'var(--c-card)' : 'transparent', color: on ? 'var(--mg-primary-900)' : 'var(--c-muted)', boxShadow: on ? 'var(--mg-shadow-sm)' : 'none' }}>{l}</button>;})}
      </span>
      <div style={{ flex: 1, minWidth: 180, display: 'flex' }}><SearchFilters f={f} setF={setF} reset={reset} active={active} counts={counts} /></div>
      <button onClick={() => flash('Обновлено')} style={{ display: 'inline-flex', alignItems: 'center', gap: '7px', height: 36, padding: '0 14px', borderRadius: 'var(--mg-radius-md)',
        border: '1px solid var(--c-border2)', background: 'transparent', color: 'var(--c-text2)', fontFamily: 'var(--mg-font-sans)', fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}>
        <i className="pi pi-refresh" style={{ fontSize: '13px' }} />Обновить</button>
    </header>
    {/* content: two-pane */}
    <div style={{ flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: 'minmax(360px, 2fr) 3fr', gap: '16px', padding: '16px 22px' }}>
      {/* list */}
      <section style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <div style={{ flex: 1, overflowY: 'auto', minHeight: 0 }}>
          {empty ? <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px', padding: '48px 24px', textAlign: 'center', height: '100%' }}>
            <i className={'pi ' + (f.view === 'failed' ? 'pi-check-circle' : 'pi-inbox')} style={{ fontSize: '30px', color: f.view === 'failed' ? 'var(--mg-green-700)' : 'var(--c-muted)', opacity: f.view === 'failed' ? 0.9 : 0.5 }} />
            <span style={{ fontSize: '14px', fontWeight: 600, color: 'var(--c-text2)' }}>{f.view === 'failed' ? 'Все входящие разобраны' : (f.view === 'all' || f.view.startsWith('ch:')) ? 'Входящих нет' : 'Здесь пусто'}</span>
            <span style={{ fontSize: '13px', color: 'var(--c-muted)', maxWidth: 260 }}>{f.view === 'failed' ? 'Сообщений без сделки не найдено' : (f.view === 'all' || f.view.startsWith('ch:')) ? 'Сообщения появятся здесь, как только поступят через подключённые каналы' : 'В этой папке пока нет сообщений'}</span>
            {active && f.view !== 'failed' && <button onClick={reset} style={{ border: 'none', background: 'transparent', color: 'var(--mg-primary-900)', fontFamily: 'var(--mg-font-sans)', fontSize: '13px', fontWeight: 600, cursor: 'pointer' }}>Сбросить фильтры</button>}</div> :
          list.map((m) => <MsgRow key={m.id} m={m} selected={sel === m.id} cozy={cozy} starred={!!stars[m.id]} onStar={toggleStar} onOpen={openMsg} onReprocess={reprocess} pending={pending} />)}
        </div>
        {!empty && <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 16px', borderTop: '1px solid var(--c-border)' }}>
          <span style={{ fontSize: '12px', color: 'var(--c-muted)' }}>Показано {list.length} из {TOTAL}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: '4px' }}>
            {['pi-angle-left', '', '', 'pi-angle-right'].map((ic, i) => ic ? <button key={i} style={{ width: 28, height: 28, borderRadius: 'var(--mg-radius-md)', border: '1px solid var(--c-border2)',
              background: 'transparent', color: 'var(--c-text2)', cursor: 'pointer' }}><i className={'pi ' + ic} style={{ fontSize: '11px' }} /></button> :
            <button key={i} style={{ width: 28, height: 28, borderRadius: 'var(--mg-radius-md)', border: 'none', cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: '12px', fontWeight: 600,
              background: i === 1 ? 'var(--mg-primary-900)' : 'transparent', color: i === 1 ? '#fff' : 'var(--c-text2)' }}>{i === 1 ? 1 : 2}</button>)}
          </span>
        </div>}
      </section>
      {/* reading */}
      <section style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden' }}>
        <Reading m={empty ? null : selMsg} admin={t.admin} starred={selMsg ? !!stars[selMsg.id] : false} onStar={toggleStar} onReprocess={reprocess} pending={pending} onToggleRead={toggleRead} />
      </section>
    </div>
    {/* toast */}
    {toast && <div style={{ position: 'absolute', bottom: 22, left: '50%', transform: 'translateX(-50%)', zIndex: 60, display: 'flex', alignItems: 'center', gap: '8px',
      background: 'var(--mg-green-900)', color: '#fff', borderRadius: 'var(--mg-radius-md)', padding: '10px 16px', fontSize: '13px', fontWeight: 600, boxShadow: 'var(--mg-shadow-lg)' }}>
      <i className="pi pi-check-circle" style={{ fontSize: '14px' }} />{toast}</div>}
    <TweaksPanel title="Tweaks">
      <TweakSection label="Бренд" />
      <TweakColor label="Акцент" value={t.accent} options={['#172747', '#2b2f36', '#312e81', '#0f4d3a']} onChange={(v) => setTweak('accent', v)} />
      <TweakSection label="Полотно" />
      <TweakToggle label="Тёмная тема" value={t.dark} onChange={(v) => setTweak('dark', v)} />
      <TweakRadio label="Плотность" value={t.density} options={['Обычная', 'Просторная']} onChange={(v) => setTweak('density', v)} />
      <TweakSection label="Демонстрация" />
      <TweakToggle label="Роль: админ (Raw payload)" value={t.admin} onChange={(v) => setTweak('admin', v)} />
      <TweakToggle label="Пустое состояние" value={t.empty} onChange={(v) => setTweak('empty', v)} />
    </TweaksPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
