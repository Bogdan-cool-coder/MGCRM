<!-- @dsCard group="CRM UI Kit" viewport="1280x860" name="Redesign — Настройки" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MACRO CRM — Настройки (redesign)</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--mg-font-sans); background: #6b7280; -webkit-font-smoothing: antialiased; }
  .surface { --c-page:#F1F2F3; --c-card:#FFFFFF; --c-border:#E3E4E6; --c-border2:#D5D6D8;
    --c-text:#272829; --c-text2:#616263; --c-muted:#7E7F82; --c-hover:#F9FAFB; --c-muted2:#ECEDEF; --sw-off:#C3C8D2; }
  /* .surface.dark navy palette from tokens/dark.css bridge */
  .surface.dark { --sw-off:#455778; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .inp:focus { outline: none; border-color: var(--mg-input-focus-border); box-shadow: var(--mg-focus-ring); }
  .inp:-webkit-autofill, .inp:-webkit-autofill:hover, .inp:-webkit-autofill:focus, .inp:-webkit-autofill:active {
    -webkit-text-fill-color: var(--c-text) !important;
    -webkit-box-shadow: 0 0 0 1000px var(--c-card) inset !important;
    caret-color: var(--c-text); transition: background-color 9999s ease 0s; }
  .urow:hover { background: var(--c-hover); }
  .uicon:hover { background: var(--c-muted2); }
  .atnode:hover .atacts { opacity: 1 !important; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="users-section.jsx"></script>
<script type="text/babel" data-presets="react" src="access-section.jsx"></script>
<script type="text/babel" data-presets="react" src="system-section.jsx"></script>
<script type="text/babel" data-presets="react">

const { useState } = React;

const GROUPS = [
{ key: 'account', label: 'Аккаунт', items: [
  { key: 'profile', icon: 'pi-user', label: 'Профиль' }]
},
{ key: 'integrations', label: 'Интеграции', items: [
  { key: 'channels', icon: 'pi-share-alt', label: 'Каналы связи' }]
},
{ key: 'directories', label: 'Справочники', items: [
  { key: 'directories', icon: 'pi-folder-open', label: 'Справочники' },
  { key: 'pipeline', icon: 'pi-sliders-h', label: 'Воронка продаж', ext: true }]
},
{ key: 'system', label: 'Система', items: [
  { key: 'users', icon: 'pi-users', label: 'Пользователи', meta: '14' },
  { key: 'access', icon: 'pi-shield', label: 'Доступ и оргструктура' },
  { key: 'auto', icon: 'pi-clock', label: 'Журнал автоматизаций' },
  { key: 'reset', icon: 'pi-refresh', label: 'Сброс системы', danger: true }]
}];


const TABS = [['profile', 'Профиль'], ['security', 'Безопасность'], ['appearance', 'Внешний вид'], ['language', 'Язык']];

function Field({ label, value, disabled, half }) {
  return <div style={{ flex: half ? 1 : 'unset', marginBottom: 16 }}>
    <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 7 }}>{label}</label>
    <input className="inp" defaultValue={value} disabled={disabled} style={{ width: '100%', height: 40, padding: '0 13px', borderRadius: 'var(--mg-radius-md)',
      border: '1px solid var(--mg-input-border)', background: disabled ? 'var(--mg-input-disabled-bg)' : 'var(--c-card)', color: disabled ? 'var(--c-muted)' : 'var(--c-text)', fontFamily: 'var(--mg-font-sans)', fontSize: 14 }} />
  </div>;
}
function Switch({ on, onClick }) {
  return <span onClick={onClick} style={{ display: 'inline-block', width: 44, height: 24, borderRadius: 999, background: on ? 'var(--mg-primary-900)' : 'var(--sw-off)', position: 'relative', cursor: 'pointer', flexShrink: 0, verticalAlign: 'middle', transition: 'background .18s ease', boxShadow: 'inset 0 0 0 1px rgba(15,23,42,.06)' }}>
    <span style={{ position: 'absolute', top: 3, insetInlineStart: on ? 23 : 3, width: 18, height: 18, borderRadius: 999, background: '#fff', boxShadow: '0 1px 2px rgba(15,23,42,.45), 0 0 0 .5px rgba(15,23,42,.04)', transition: 'inset-inline-start .18s ease' }} /></span>;
}
function SettingRow({ icon, title, sub, children, last }) {
  return <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '15px 0', borderBottom: last ? 'none' : '1px solid var(--c-border)' }}>
    {icon && <span style={{ width: 34, height: 34, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><i className={'pi ' + icon} style={{ fontSize: 15, color: 'var(--mg-primary-900)' }} /></span>}
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--c-text)' }}>{title}</div>
      {sub && <div style={{ fontSize: 12.5, color: 'var(--c-muted)', marginTop: 2 }}>{sub}</div>}
    </div>
    {children}
  </div>;
}
function Card({ title, desc, children }) {
  return <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', padding: '20px 22px', marginBottom: 16 }}>
    {title && <div style={{ marginBottom: 6 }}><div style={{ fontSize: 15, fontWeight: 600, color: 'var(--c-text)' }}>{title}</div>
      {desc && <div style={{ fontSize: 13, color: 'var(--c-muted)', marginTop: 2 }}>{desc}</div>}</div>}
    {children}
  </div>;
}

function ProfileTab() {
  return <React.Fragment>
    <Card title="Личные данные" desc="Как вас видят коллеги в системе">
      <div style={{ display: 'flex', gap: 14 }}><Field label="Имя" value="Богдан" half /><Field label="Фамилия" value="Ядыкин" half /></div>
      <div style={{ display: 'flex', gap: 14 }}><Field label="Телефон" value="+7 777 012 34 56" half /><Field label="Email" value="b.yadykin@macroglobal.tech" disabled half /></div>
      <Field label="Должность" value="Администратор" disabled />
      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 6 }}>
        <button style={btn('ghost')}>Отмена</button><button style={btn('primary')}><i className="pi pi-check" style={{ fontSize: 12 }} />Сохранить</button>
      </div>
    </Card>
  </React.Fragment>;
}
function SecurityTab({ setModal }) {
  const [f2, setF2] = useState(true);
  return <Card title="Безопасность" desc="Пароль, двухфакторная защита и сессии">
    <SettingRow icon="pi-key" title="Пароль" sub="Последнее изменение 3 месяца назад"><button style={btn('ghost')} onClick={() => setModal('password')}>Сменить</button></SettingRow>
    <SettingRow icon="pi-lock" title="Двухфакторная аутентификация" sub={f2 ? 'Включена · приложение-аутентификатор' : 'Отключена'}><Switch on={f2} onClick={() => {if (!f2) setModal('2fa');setF2(!f2);}} /></SettingRow>
    <SettingRow icon="pi-desktop" title="Активные сессии" sub="3 устройства" last><button style={btn('ghost')} onClick={() => setModal('sessions')}>Управлять</button></SettingRow>
  </Card>;
}
function AppearanceTab({ dark, setDark, accent, setAccent, density, setDensity }) {
  const themes = [['light', 'Светлая', 'pi-sun'], ['dark', 'Тёмная', 'pi-moon']];
  const accents = ['#172747', '#2B4987', '#312e81', '#0f4d3a'];
  return <Card title="Внешний вид" desc="Тема, акцент и плотность интерфейса">
    <div style={{ padding: '6px 0 16px', borderBottom: '1px solid var(--c-border)' }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 10 }}>Тема</div>
      <div style={{ display: 'flex', gap: 12 }}>{themes.map(([k, l, ic]) => {const on = k === 'dark' === dark;
          return <div key={k} onClick={() => setDark(k === 'dark')} style={{ flex: 1, cursor: 'pointer', border: '2px solid ' + (on ? 'var(--mg-primary-900)' : 'var(--c-border2)'), borderRadius: 'var(--mg-radius-md)', padding: 14, background: k === 'dark' ? '#0A1426' : '#fff', color: k === 'dark' ? '#EAF0FA' : '#272829', position: 'relative' }}>
          <i className={'pi ' + ic} style={{ fontSize: 16 }} /><div style={{ fontSize: 13, fontWeight: 600, marginTop: 8 }}>{l}</div>
          {on && <i className="pi pi-check-circle" style={{ position: 'absolute', top: 10, insetInlineEnd: 10, color: 'var(--mg-primary-900)', fontSize: 15 }} />}</div>;})}</div>
    </div>
    <div style={{ padding: '16px 0', borderBottom: '1px solid var(--c-border)' }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 10 }}>Акцент</div>
      <div style={{ display: 'flex', gap: 10 }}>{accents.map((c) => <span key={c} onClick={() => setAccent(c)} style={{ width: 30, height: 30, borderRadius: '50%', background: c, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', boxShadow: accent === c ? '0 0 0 3px var(--c-card), 0 0 0 5px ' + c : 'none' }}>{accent === c && <i className="pi pi-check" style={{ color: '#fff', fontSize: 12 }} />}</span>)}</div>
    </div>
    <div style={{ paddingTop: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)' }}>Плотность интерфейса</div>
      <div style={{ fontSize: 12, color: 'var(--c-muted)', margin: '3px 0 10px', maxWidth: 460 }}>Насколько плотно расположены строки в таблицах, списках и на досках. «Компактная» — больше данных на экране, «Просторная» — крупнее и воздушнее.</div>
      <div style={{ display: 'inline-flex', gap: 2, background: 'var(--mg-surface-muted)', borderRadius: 7, padding: 3 }}>{[['compact', 'Компактная'], ['cozy', 'Просторная']].map(([k, l]) => {const on = density === k;
          return <button key={k} onClick={() => setDensity(k)} style={{ height: 30, padding: '0 14px', border: 'none', borderRadius: 5, cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: 12.5, fontWeight: 600, background: on ? 'var(--c-card)' : 'transparent', color: on ? 'var(--mg-primary-900)' : 'var(--c-muted)', boxShadow: on ? 'var(--mg-shadow-sm)' : 'none' }}>{l}</button>;})}</div>
    </div>
  </Card>;
}
function LanguageTab() {
  const [lang, setLang] = useState('ru');
  const langs = [['ru', 'Русский', 'RU'], ['en', 'English', 'EN'], ['ar', 'العربية', 'AR']];
  return <Card title="Язык интерфейса" desc="Применяется ко всему приложению">
    {langs.map(([k, l, c], i) => <div key={k} onClick={() => setLang(k)} style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '13px 0', borderBottom: i < langs.length - 1 ? '1px solid var(--c-border)' : 'none', cursor: 'pointer' }}>
      <span style={{ width: 30, height: 30, borderRadius: 'var(--mg-radius-sm)', background: 'var(--mg-surface-muted)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: 'var(--c-text2)' }}>{c}</span>
      <span style={{ flex: 1, fontSize: 14, color: 'var(--c-text)' }}>{l}</span>
      <span style={{ width: 20, height: 20, borderRadius: '50%', border: '2px solid ' + (lang === k ? 'var(--mg-primary-900)' : 'var(--c-border2)'), display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{lang === k && <span style={{ width: 10, height: 10, borderRadius: '50%', background: 'var(--mg-primary-900)' }} />}</span>
    </div>)}
  </Card>;
}

function Modal({ title, icon, children, footer, close, width }) {
  return <div onClick={close} style={{ position: 'fixed', inset: 0, zIndex: 1300, background: 'rgba(9,16,32,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
    <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: width || 440, background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-lg)', overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '16px 20px', borderBottom: '1px solid var(--c-border)' }}>
        {icon && <i className={'pi ' + icon} style={{ fontSize: 17, color: 'var(--mg-primary-900)' }} />}
        <span style={{ flex: 1, fontSize: 16, fontWeight: 600, color: 'var(--c-text)' }}>{title}</span>
        <i className="pi pi-times" onClick={close} style={{ fontSize: 14, color: 'var(--c-muted)', cursor: 'pointer' }} />
      </div>
      <div style={{ padding: 20 }}>{children}</div>
      {footer && <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0 20px 18px' }}>{footer}</div>}
    </div>
  </div>;
}
function dbtn() {return { ...btn('ghost'), color: 'var(--mg-status-danger-text)', borderColor: 'var(--mg-status-danger-border)' };}
function PhotoModal({ close }) {
  return <Modal title="Изменить фото" icon="pi-camera" close={close} width={430}
  footer={<React.Fragment><button style={dbtn()}>Удалить</button><span style={{ flex: 1 }} /><button style={btn('ghost')} onClick={close}>Отмена</button><button style={btn('primary')} onClick={close}><i className="pi pi-check" style={{ fontSize: 12 }} />Сохранить</button></React.Fragment>}>
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
      <span style={{ width: 92, height: 92, borderRadius: '50%', background: 'var(--mg-primary-900)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 32, fontWeight: 600 }}>БЯ</span>
      <div style={{ width: '100%', border: '1.5px dashed var(--c-border2)', borderRadius: 'var(--mg-radius-md)', padding: '22px', textAlign: 'center', background: 'var(--c-hover)' }}>
        <i className="pi pi-cloud-upload" style={{ fontSize: 24, color: 'var(--mg-primary-900)' }} />
        <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text)', marginTop: 8 }}>Перетащите фото или <span style={{ color: 'var(--mg-primary-900)' }}>выберите файл</span></div>
        <div style={{ fontSize: 12, color: 'var(--c-muted)', marginTop: 4 }}>PNG, JPG до 5 МБ · квадрат от 200×200</div>
      </div>
    </div>
  </Modal>;
}
function PasswordModal({ close }) {
  const F = ({ label }) => <div style={{ marginBottom: 14 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 7 }}>{label}</label><div style={{ display: 'flex', alignItems: 'center', height: 40, padding: '0 12px', border: '1px solid var(--mg-input-border)', borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)' }}><span style={{ flex: 1, color: 'var(--c-muted)', letterSpacing: '2px' }}>••••••••</span><i className="pi pi-eye" style={{ color: 'var(--c-muted)', fontSize: 14, cursor: 'pointer' }} /></div></div>;
  const req = (ok, t) => <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: ok ? 'var(--mg-status-success-text)' : 'var(--c-muted)' }}><i className={'pi ' + (ok ? 'pi-check-circle' : 'pi-circle')} style={{ fontSize: 13 }} />{t}</div>;
  return <Modal title="Смена пароля" icon="pi-key" close={close} width={430}
  footer={<React.Fragment><span style={{ flex: 1 }} /><button style={btn('ghost')} onClick={close}>Отмена</button><button style={btn('primary')} onClick={close}>Сменить пароль</button></React.Fragment>}>
    <F label="Текущий пароль" /><F label="Новый пароль" /><F label="Повторите новый пароль" />
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 4, padding: '12px 14px', background: 'var(--c-hover)', borderRadius: 'var(--mg-radius-md)' }}>
      {req(true, 'Минимум 8 символов')}{req(true, 'Буквы и цифры')}{req(false, 'Хотя бы один спецсимвол')}
    </div>
  </Modal>;
}
function TwoFAModal({ close }) {
  return <Modal title="Двухфакторная аутентификация" icon="pi-lock" close={close} width={470}
  footer={<React.Fragment><span style={{ flex: 1 }} /><button style={btn('ghost')} onClick={close}>Отмена</button><button style={btn('primary')} onClick={close}><i className="pi pi-check" style={{ fontSize: 12 }} />Подтвердить</button></React.Fragment>}>
    <div style={{ fontSize: 13, color: 'var(--c-text2)', lineHeight: 1.5, marginBottom: 16 }}>Отсканируйте QR-код в приложении-аутентификаторе (Google Authenticator, 1Password) и введите 6-значный код.</div>
    <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>
      <div style={{ width: 116, height: 116, flexShrink: 0, borderRadius: 'var(--mg-radius-md)', background: '#fff', border: '1px solid var(--c-border)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><i className="pi pi-qrcode" style={{ fontSize: 62, color: '#111' }} /></div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12, color: 'var(--c-muted)', marginBottom: 6 }}>Или введите ключ вручную:</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 11px', background: 'var(--c-hover)', borderRadius: 'var(--mg-radius-sm)', fontFamily: 'ui-monospace,monospace', fontSize: 13, color: 'var(--c-text)' }}>JBSW Y3DP EHPK 3PXP<i className="pi pi-copy" style={{ marginInlineStart: 'auto', color: 'var(--c-muted)', cursor: 'pointer' }} /></div>
      </div>
    </div>
    <div style={{ marginTop: 18 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 8 }}>Код из приложения</label>
      <div style={{ display: 'flex', gap: 8 }}>{[0, 1, 2, 3, 4, 5].map((i) => <span key={i} style={{ width: 44, height: 48, border: '1px solid ' + (i < 3 ? 'var(--mg-primary-900)' : 'var(--mg-input-border)'), borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, fontWeight: 600, color: 'var(--c-text)' }}>{i < 3 ? ['1', '2', '4'][i] : ''}</span>)}</div></div>
  </Modal>;
}
function SessionsModal({ close }) {
  const S = ({ icon, dev, loc, active, cur, last }) => <div style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '13px 0', borderBottom: last ? 'none' : '1px solid var(--c-border)' }}>
    <span style={{ width: 36, height: 36, borderRadius: 'var(--mg-radius-md)', background: 'var(--c-hover)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><i className={'pi ' + icon} style={{ fontSize: 15, color: 'var(--c-text2)' }} /></span>
    <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--c-text)' }}>{dev}</div><div style={{ fontSize: 12, color: 'var(--c-muted)', marginTop: 2 }}>{loc} · {active}</div></div>
    {cur ? <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, background: 'var(--mg-status-success-bg)', color: 'var(--mg-status-success-text)' }}>Текущая</span> : <button style={{ ...btn('ghost'), height: 32, padding: '0 12px', fontSize: 12.5 }}>Завершить</button>}
  </div>;
  return <Modal title="Активные сессии" icon="pi-desktop" close={close} width={520}
  footer={<React.Fragment><button style={dbtn()}>Завершить все остальные</button><span style={{ flex: 1 }} /><button style={btn('primary')} onClick={close}>Готово</button></React.Fragment>}>
    <S icon="pi-desktop" dev="MacBook Pro · Chrome" loc="Алматы, KZ · 2.56.14.xx" active="сейчас" cur />
    <S icon="pi-mobile" dev="iPhone 15 · Safari" loc="Алматы, KZ" active="12 мин назад" />
    <S icon="pi-desktop" dev="Windows · Edge" loc="Дубай, AE · 94.xx.xx.xx" active="вчера 18:40" last />
  </Modal>;
}
function Modals({ modal, close }) {
  if (modal === 'photo') return <PhotoModal close={close} />;
  if (modal === 'password') return <PasswordModal close={close} />;
  if (modal === '2fa') return <TwoFAModal close={close} />;
  if (modal === 'sessions') return <SessionsModal close={close} />;
  return null;
}

function ChannelsTab() {
  const [linked, setLinked] = useState(true);
  const [cm, setCm] = useState(null);
  const Row = ({ icon, name, status, action, dis }) => <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '16px', background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', opacity: dis ? 0.6 : 1 }}>
    <span style={{ width: 44, height: 44, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><i className={'pi ' + icon} style={{ fontSize: 20, color: 'var(--mg-primary-900)' }} /></span>
    <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 14, fontWeight: 600, color: 'var(--c-text)' }}>{name}</div><div style={{ fontSize: 13, color: 'var(--c-muted)', marginTop: 3, display: 'flex', alignItems: 'center', gap: 8 }}>{status}</div></div>
    {action}
  </div>;
  const tag = (bg, fg, tx) => <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, background: bg, color: fg }}>{tx}</span>;
  return <React.Fragment>

      f[0] === 'reset' ? <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, color: 'var(--c-muted)', cursor: 'pointer' }}><i className="pi pi-refresh" style={{ fontSize: 12 }} />Сбросить</span> :

      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, height: 38, padding: '0 12px', minWidth: 150, border: '1px solid var(--mg-input-border)', borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)' }}><span style={{ flex: 1, fontSize: 13.5, color: 'var(--c-muted)' }}>{f[1]}</span><i className={'pi ' + (f[0] === 'date' ? 'pi-calendar' : 'pi-chevron-down')} style={{ fontSize: 12, color: 'var(--c-muted)' }} /></div>)}
    </div>}

    {/* subtabs (custom fields) */}
    {cur.subtabs && <div style={{ display: 'flex', gap: 4, borderBottom: '1px solid var(--c-border)', marginBottom: 16 }}>
      {cur.subtabs.map((s) => {const on = s === cfScope;return <button key={s} onClick={() => setCfScope(s)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: '9px 12px', marginBottom: -1, fontFamily: 'var(--mg-font-sans)', fontSize: 13.5, fontWeight: on ? 600 : 500, color: on ? 'var(--mg-primary-900)' : 'var(--c-muted)', borderBottom: '2px solid ' + (on ? 'var(--mg-primary-900)' : 'transparent') }}>{s}</button>;})}
    </div>}

    <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden' }}>

      </div> : <div style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: catMin }}>
        <thead><tr>{dragOn && <th style={{ ...th, width: 34 }} />}{visCols.map((c, ci) => <th key={ci} style={{ ...th, textAlign: c[2] || 'start' }}>{c[0]}</th>)}</tr></thead>
        <tbody>{rowsToShow.map(([ri, r], pos) => <tr key={ri} draggable={dragOn ? true : undefined}
            onDragStart={dragOn ? () => {dragRef.current = pos;} : undefined}
            onDragOver={dragOn ? (e) => e.preventDefault() : undefined}
            onDrop={dragOn ? () => onDrop(pos) : undefined}
            style={{ background: pos % 2 ? 'var(--c-hover)' : 'var(--c-card)', cursor: dragOn ? 'grab' : 'default' }}>
          {dragOn && <td style={{ ...td, width: 34, textAlign: 'center', color: 'var(--c-border2)' }}><i className="pi pi-bars" style={{ fontSize: 13 }} /></td>}
          {visCols.map((c, ci) => <td key={ci} style={{ ...td, textAlign: c[2] || 'start' }}>{cellRender(c[1], r[ci], ri)}</td>)}
        </tr>)}</tbody>
      </table></div>}
    </div>
    {amodal && <DirModal dt={dt} close={() => setAmodal(false)} />}
    {editRec != null && <DirModal dt={dt} edit={true} row={cur.rows[editRec]} close={() => setEditRec(null)} />}
    {edit && <ProductEditModal row={edit} close={() => setEdit(null)} />}
  </React.Fragment>;
}

      {kind === 'color' ? <div style={{ display: 'flex', gap: 10 }}>{['#D4537E', '#EF9F27', '#378ADD', '#1D9E75', '#7F77DD'].map((c, ci) => {const sel = editMode ? cfg.v[i] === c : ci === 0;return <span key={c} style={{ width: 28, height: 28, borderRadius: '50%', background: c, cursor: 'pointer', boxShadow: sel ? '0 0 0 3px var(--c-card), 0 0 0 5px ' + c : 'none' }} />;})}</div> :
      kind === 'select' ? <Sel ph={editMode && cfg.v[i] ? cfg.v[i] : 'Выберите…'} /> : <Txt ph={lbl} val={editMode ? cfg.v[i] : undefined} />}
    </Fld>)}
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 4, paddingTop: 14, borderTop: '1px solid var(--c-border)' }}><Switch on onClick={() => {}} /><span style={{ fontSize: 13.5, color: 'var(--c-text)' }}>{editMode ? 'Активна' : 'Активна сразу после создания'}</span></div>
  </Modal>;
}

    <div style={{ paddingTop: 14, borderTop: '1px solid var(--c-border)' }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 4 }}>Привязки</div>
      <div style={{ fontSize: 11.5, color: 'var(--c-muted)', marginBottom: 10 }}>Условия, при которых шаблон подставляется автоматически. Без привязок — универсальный шаблон.</div>
      {binds.length > 0 && <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 10 }}>{binds.map((b, i) => <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 12.5, fontWeight: 500, padding: '5px 10px', borderRadius: 999, background: 'var(--mg-primary-100)', color: 'var(--mg-primary-900)' }}><i className="pi pi-link" style={{ fontSize: 11 }} />{label(b)}<i className="pi pi-times" onClick={() => setBinds((a) => a.filter((_, k) => k !== i))} style={{ fontSize: 11, cursor: 'pointer', opacity: .7 }} /></span>)}</div>}
      {!open ? <button style={{ ...btn('ghost'), color: 'var(--mg-primary-900)', borderColor: 'var(--c-border)' }} onClick={() => setOpen(true)}><i className="pi pi-plus" style={{ fontSize: 12 }} />Добавить привязку</button> :
      <div style={{ border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-md)', padding: 12, background: 'var(--c-hover)' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <div><div style={lbl}>Канал</div><select style={sel} value={bf.ch} onChange={(e) => setBf({ ...bf, ch: e.target.value })}><option value="">— любой —</option>{CH.map((x) => <option key={x}>{x}</option>)}</select></div>
            <div><div style={lbl}>Воронка</div><select style={sel} value={bf.pl} onChange={(e) => setBf({ ...bf, pl: e.target.value, st: '' })}><option value="">— любая —</option>{PL.map((x) => <option key={x}>{x}</option>)}</select></div>
            <div><div style={lbl}>Этап</div><select style={{ ...sel, opacity: bf.pl ? 1 : .5 }} disabled={!bf.pl} value={bf.st} onChange={(e) => setBf({ ...bf, st: e.target.value })}><option value="">— любой —</option>{ST.map((x) => <option key={x}>{x}</option>)}</select></div>
            <div><div style={lbl}>Тип активности</div><select style={sel} value={bf.ac} onChange={(e) => setBf({ ...bf, ac: e.target.value })}><option value="">— любой —</option>{AC.map((x) => <option key={x}>{x}</option>)}</select></div>
          </div>
          <div style={{ marginTop: 10 }}><div style={lbl}>Слот автоматизации</div><input className="inp" style={{ ...inp, height: 38 }} placeholder="напр. deal_won, lead_created" value={bf.slot} onChange={(e) => setBf({ ...bf, slot: e.target.value })} /></div>
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}><button style={btn('primary')} onClick={addB}><i className="pi pi-check" style={{ fontSize: 12 }} />Добавить</button><button style={btn('ghost')} onClick={() => setOpen(false)}>Отмена</button></div>
        </div>}
    </div>
    <div style={{ paddingTop: 14, marginTop: 14, borderTop: '1px solid var(--c-border)' }}><Tgl label="Активен" on={editMode ? !!R[2] : true} /></div>
  </Modal>;
}

/* ── Approval route builder dialog ── */
function RouteModal({ close, Fld, Sel, Txt, Tgl, foot, inp }) {
  const [stages, setStages] = useState([{ name: 'Юридическая проверка' }, { name: 'Утверждение директором' }]);
  return <Modal title="Новый маршрут согласования" icon="pi-sitemap" close={close} width={560} footer={foot('Создать')}>
    <div style={{ display: 'flex', gap: 14 }}><div style={{ flex: 1.5 }}><Fld label="Название" req><Txt ph="Согласование договора" /></Fld></div><div style={{ flex: 1 }}><Fld label="Тип документа" req><Sel ph="Договор" /></Fld></div></div>
    <Tgl label="По умолчанию для типа" sub="Будет применяться автоматически ко всем документам этого типа" on={false} />
    <div style={{ marginTop: 6, paddingTop: 14, borderTop: '1px solid var(--c-border)' }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 10 }}>Этапы согласования</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {stages.map((s, i) => <div key={i} style={{ border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-md)', padding: '12px', background: 'var(--c-hover)' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <span style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 600, color: 'var(--c-text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginInlineEnd: 8 }}>{i + 1}. {s.name}</span>
            <span style={{ display: 'inline-flex', gap: 4 }}>
              <i className="pi pi-arrow-up" style={{ fontSize: 12, color: i === 0 ? 'var(--c-border2)' : 'var(--c-muted)', cursor: 'pointer', padding: 3 }} />
              <i className="pi pi-arrow-down" style={{ fontSize: 12, color: i === stages.length - 1 ? 'var(--c-border2)' : 'var(--c-muted)', cursor: 'pointer', padding: 3 }} />
              <i className="pi pi-trash" style={{ fontSize: 12, color: 'var(--mg-status-danger-text)', cursor: 'pointer', padding: 3 }} onClick={() => setStages((a) => a.filter((_, k) => k !== i))} />
            </span>
          </div>
          <input className="inp" style={{ ...inp, marginBottom: 8 }} defaultValue={s.name} placeholder="Название этапа" />
          <div style={{ display: 'flex', gap: 8 }}><div style={{ flex: 1 }}><Sel ph="Участники (роли / пользователи)" /></div><div style={{ width: 130 }}><div style={{ ...inp, display: 'flex', alignItems: 'center' }}><span style={{ flex: 1, color: 'var(--c-muted)', fontSize: 13 }}>Мин. 1</span></div></div></div>
        </div>)}
      </div>
      <button style={{ ...btn('ghost'), marginTop: 10, color: 'var(--mg-primary-900)', borderColor: 'var(--c-border)' }} onClick={() => setStages((a) => [...a, { name: 'Новый этап' }])}><i className="pi pi-plus" style={{ fontSize: 12 }} />Добавить этап</button>
    </div>
  </Modal>;
}

function btn(kind) {
  const base = { display: 'inline-flex', alignItems: 'center', gap: 7, height: 38, padding: '0 15px', borderRadius: 'var(--mg-radius-md)', fontFamily: 'var(--mg-font-sans)', fontSize: 13, fontWeight: 600, cursor: 'pointer', border: 'none', whiteSpace: 'nowrap' };
  if (kind === 'primary') return { ...base, background: 'var(--mg-primary-900)', color: '#fff' };
  return { ...base, background: 'transparent', color: 'var(--c-text2)', border: '1px solid var(--c-border2)' };
}

function App() {
  const [sec, setSec] = useState('profile');
  const [tab, setTab] = useState('profile');
  const [q, setQ] = useState('');
  const [dark, setDark] = useState(false);
  const [accent, setAccent] = useState('#172747');
  const [density, setDensity] = useState('compact');
  const [modal, setModal] = useState(null);
  const DARKACC = { '#172747': '#4C7DF0', '#2B4987': '#6E99FF', '#312e81': '#8b87ff', '#0f4d3a': '#3fbf8f' };
  const acc = dark ? DARKACC[accent] || '#4C7DF0' : accent;
  const ACCH = { '#172747': '#1f2f5a', '#2B4987': '#3a5ca8', '#312e81': '#3f3a9e', '#0f4d3a': '#13654c' };

  const filtered = GROUPS.map((g) => ({ ...g, items: g.items.filter((it) => it.label.toLowerCase().includes(q.trim().toLowerCase())) })).filter((g) => g.items.length);
  const activeLabel = (GROUPS.flatMap((g) => g.items).find((it) => it.key === sec) || {}).label;

  return <div className={'surface' + (dark ? ' dark' : '') + (density === 'cozy' ? ' mg-cozy' : '')}
  style={{ '--mg-primary-900': acc, '--mg-primary-800': dark ? '#6E99FF' : ACCH[accent] || '#1f2f5a', '--mg-primary-100': dark ? 'rgba(76,125,240,0.16)' : undefined,
    height: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--c-page)', color: 'var(--c-text)' }}>

    {/* module header */}
    <header style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '15px 24px', background: 'var(--c-card)', borderBottom: '1px solid var(--c-border)', flexShrink: 0 }}>
      <span style={{ width: 38, height: 38, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><i className="pi pi-cog" style={{ fontSize: 18, color: 'var(--mg-primary-900)' }} /></span>
      <h1 style={{ margin: 0, fontSize: 20, fontWeight: 600, flex: 1 }}>Настройки</h1>
      <button onClick={() => setDark(!dark)} style={{ ...btn('ghost'), width: 38, padding: 0, justifyContent: 'center' }}><i className={'pi ' + (dark ? 'pi-sun' : 'pi-moon')} style={{ fontSize: 15 }} /></button>
    </header>

    <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
      {/* rail */}
      <nav style={{ width: 264, flexShrink: 0, overflowY: 'auto', background: 'var(--c-card)', borderInlineEnd: '1px solid var(--c-border)', padding: '14px 0' }}>
        <div style={{ padding: '0 12px 12px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 11px', border: '1px solid var(--c-border2)', borderRadius: 'var(--mg-radius-md)', background: 'var(--c-page)' }}>
            <i className="pi pi-search" style={{ fontSize: 12, color: 'var(--c-muted)' }} />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск по настройкам…" style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontFamily: 'var(--mg-font-sans)', fontSize: 13, color: 'var(--c-text)' }} />
          </div>
        </div>
        {filtered.map((g) => <div key={g.key} style={{ marginBottom: 6 }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.07em', textTransform: 'uppercase', color: 'var(--c-muted)', padding: '12px 18px 6px' }}>{g.label}</div>
          {g.items.map((it) => {const on = it.key === sec;
            return <button key={it.key} onClick={() => {setSec(it.key);setTab('profile');}} style={{ display: 'flex', alignItems: 'center', gap: 11, width: 'calc(100% - 16px)', margin: '2px 8px', padding: '9px 12px', border: 'none', background: on ? 'var(--mg-primary-100)' : 'transparent', borderRadius: 'var(--mg-radius-md)', cursor: 'pointer', textAlign: 'start', fontFamily: 'var(--mg-font-sans)', fontSize: 13, fontWeight: on ? 600 : 500, color: it.danger && !on ? 'var(--mg-status-danger-text)' : on ? 'var(--mg-primary-900)' : 'var(--c-text2)', boxShadow: on ? 'inset 3px 0 0 var(--mg-primary-900)' : 'none' }}>
              <i className={'pi ' + it.icon} style={{ fontSize: 14, width: 16, opacity: .8 }} />
              <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{it.label}</span>
              {it.meta && <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--c-muted)' }}>{it.meta}</span>}
              {it.ext && <i className="pi pi-external-link" style={{ fontSize: 11, opacity: .5 }} />}
            </button>;})}
        </div>)}
      </nav>

      {/* detail */}
      <div style={{ flex: 1, overflowY: 'auto', background: 'var(--c-page)', padding: '24px' }}>
        <div style={{ maxWidth: sec === 'users' || sec === 'access' ? 1080 : 680, margin: '0 auto' }}>
          {sec === 'profile' ? <React.Fragment>
            {/* profile hero */}
            <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden', marginBottom: 16 }}>
              <div style={{ background: 'linear-gradient(100deg, var(--mg-primary-900), var(--mg-primary-800))', padding: '22px 24px', display: 'flex', alignItems: 'center', gap: 18 }}>
                <span style={{ width: 72, height: 72, borderRadius: '50%', background: 'rgba(255,255,255,0.18)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26, fontWeight: 600, border: '3px solid rgba(255,255,255,0.5)', flexShrink: 0 }}>БЯ</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}><span style={{ fontSize: 20, fontWeight: 600, color: '#fff' }}>Богдан Ядыкин</span>
                    <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 999, background: 'rgba(255,255,255,0.18)', color: '#fff' }}>Администратор</span></div>
                  <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.82)', marginTop: 4 }}>b.yadykin@macroglobal.tech</div>
                </div>
                <button style={{ display: 'inline-flex', alignItems: 'center', gap: 7, height: 38, padding: '0 15px', borderRadius: 'var(--mg-radius-md)', fontFamily: 'var(--mg-font-sans)', fontSize: 13, fontWeight: 600, cursor: 'pointer', border: '1px solid rgba(255,255,255,0.32)', background: 'rgba(255,255,255,0.12)', color: '#fff', flexShrink: 0, whiteSpace: 'nowrap' }} onClick={() => setModal('photo')}><i className="pi pi-camera" style={{ fontSize: 13 }} />Изменить фото</button>
              </div>
              <div style={{ display: 'flex', gap: 24, padding: '14px 24px', flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: 'var(--c-text2)', whiteSpace: 'nowrap' }}><i className="pi pi-clock" style={{ fontSize: 13, color: 'var(--c-muted)' }} />Вход: сегодня 09:12</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: 'var(--mg-status-success-text)', whiteSpace: 'nowrap' }}><i className="pi pi-verified" style={{ fontSize: 13 }} />2FA включена</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: 'var(--c-text2)', whiteSpace: 'nowrap' }}><i className="pi pi-globe" style={{ fontSize: 13, color: 'var(--c-muted)' }} />Русский</div>
              </div>
            </div>
            {/* subtabs */}
            <div style={{ display: 'flex', gap: 4, borderBottom: '1px solid var(--c-border)', marginBottom: 18 }}>
              {TABS.map(([k, l]) => {const on = tab === k;
                return <button key={k} onClick={() => setTab(k)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: '10px 14px', marginBottom: -1, fontFamily: 'var(--mg-font-sans)', fontSize: 14, fontWeight: on ? 600 : 500, whiteSpace: 'nowrap', color: on ? 'var(--mg-primary-900)' : 'var(--c-muted)', borderBottom: '2px solid ' + (on ? 'var(--mg-primary-900)' : 'transparent') }}>{l}</button>;})}
            </div>
            {tab === 'profile' && <ProfileTab />}
            {tab === 'security' && <SecurityTab setModal={setModal} />}
            {tab === 'appearance' && <AppearanceTab dark={dark} setDark={setDark} accent={accent} setAccent={setAccent} density={density} setDensity={setDensity} />}
            {tab === 'language' && <LanguageTab />}
          </React.Fragment> : sec === 'users' ? <UsersTab /> : sec === 'access' ? <AccessTab /> : sec === 'channels' ? <ChannelsTab /> : sec === 'directories' ? <DirectoriesTab /> : sec === 'auto' ? <AutomationsTab /> : sec === 'reset' ? <ResetTab /> :
          <React.Fragment>
              <h2 style={{ margin: '2px 0 4px', fontSize: 18, fontWeight: 600 }}>{activeLabel}</h2>
              <p style={{ margin: '0 0 16px', fontSize: 13, color: 'var(--c-muted)' }}>Раздел настроек</p>
              <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, padding: '52px 20px', color: 'var(--c-muted)' }}>
                <i className="pi pi-cog" style={{ fontSize: 30 }} /><div style={{ fontSize: 14, color: 'var(--c-text2)' }}>«{activeLabel}»</div>
              </div>
            </React.Fragment>
          }
        </div>
      </div>
    </div>
    <Modals modal={modal} close={() => setModal(null)} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
