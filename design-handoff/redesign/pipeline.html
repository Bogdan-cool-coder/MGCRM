<!-- @dsCard group="CRM UI Kit" viewport="1280x860" name="Redesign — Настройки воронки продаж" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MACRO CRM — Воронка продаж (redesign)</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--mg-font-sans); background: #6b7280; -webkit-font-smoothing: antialiased; }
  .surface { --c-page:#F1F2F3; --c-card:#FFFFFF; --c-border:#E3E4E6; --c-border2:#D5D6D8;
    --c-text:#272829; --c-text2:#616263; --c-muted:#7E7F82; --c-hover:#F9FAFB; }
  * { scrollbar-width: thin; scrollbar-color: var(--c-border2) transparent; }
  .inp:focus { outline: none; border-color: var(--mg-input-focus-border); box-shadow: var(--mg-focus-ring); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const PIPELINES = [
  { id: 1, name: 'Продажи', stages: 7 },
  { id: 2, name: 'Партнёрский канал', stages: 5 },
  { id: 3, name: 'Онбординг клиента', stages: 4 },
];
const STAGES = [
  { id: 1, name: 'Новые лиды', color: '#1D9E75', kind: 'Обычный', autos: [['pi-bolt','Автозадача «Прозвон»']] },
  { id: 2, name: 'Квалификация', color: '#D4537E', kind: 'Обычный', autos: [] },
  { id: 3, name: 'Презентация', color: '#378ADD', kind: 'Обычный', autos: [['pi-envelope','Письмо с КП']] },
  { id: 4, name: 'Переговоры', color: '#EF9F27', kind: 'Обычный', autos: [['pi-bolt','Задача менеджеру'],['pi-telegram','Уведомление в Telegram']], subs: [
      { id: 41, name: 'Согласование цены', color: '#EF9F27' },
      { id: 42, name: 'Юридическая проверка', color: '#EF9F27' },
  ]},
  { id: 5, name: 'Договор', color: '#7F77DD', kind: 'Обычный', autos: [['pi-file','Генерация договора']] },
  { id: 6, name: 'Успешно', color: '#1D9E75', kind: 'Успех', autos: [['pi-check-circle','Пометить сделку won']] },
  { id: 7, name: 'Отказ', color: '#FF5A44', kind: 'Отказ', hidden: true, autos: [] },
];

function btn(kind) {
  const base = { display: 'inline-flex', alignItems: 'center', gap: 7, height: 38, padding: '0 15px', borderRadius: 'var(--mg-radius-md)', fontFamily: 'var(--mg-font-sans)', fontSize: 13, fontWeight: 600, cursor: 'pointer', border: 'none', whiteSpace: 'nowrap' };
  if (kind === 'primary') return { ...base, background: 'var(--mg-primary-900)', color: '#fff' };
  return { ...base, background: 'transparent', color: 'var(--c-text2)', border: '1px solid var(--c-border2)' };
}
function Switch({ on, onClick }) {
  return <span onClick={onClick} style={{ width: 40, height: 22, borderRadius: 999, background: on ? 'var(--mg-primary-900)' : 'var(--c-border2)', position: 'relative', cursor: 'pointer', flexShrink: 0 }}>
    <span style={{ position: 'absolute', top: 2, insetInlineStart: on ? 20 : 2, width: 18, height: 18, borderRadius: 999, background: '#fff', boxShadow: 'var(--mg-shadow-sm)' }} /></span>;
}
function Modal({ title, icon, children, footer, close, width }) {
  return <div onClick={close} style={{ position: 'fixed', inset: 0, zIndex: 1300, background: 'rgba(9,16,32,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
    <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: width || 460, background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-lg)', overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '16px 20px', borderBottom: '1px solid var(--c-border)' }}>
        {icon && <i className={'pi ' + icon} style={{ fontSize: 17, color: 'var(--mg-primary-900)' }} />}
        <span style={{ flex: 1, fontSize: 16, fontWeight: 600, color: 'var(--c-text)' }}>{title}</span>
        <i className="pi pi-times" onClick={close} style={{ fontSize: 14, color: 'var(--c-muted)', cursor: 'pointer' }} />
      </div>
      <div style={{ padding: 20 }}>{children}</div>
      {footer && <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0 20px 18px' }}>{footer}</div>}
    </div>
  </div>;
}
const inpS = { width: '100%', height: 40, padding: '0 13px', borderRadius: 'var(--mg-radius-md)', border: '1px solid var(--mg-input-border)', background: 'var(--c-card)', color: 'var(--c-text)', fontFamily: 'var(--mg-font-sans)', fontSize: 14, boxSizing: 'border-box' };
const selS = { display: 'flex', alignItems: 'center', height: 40, padding: '0 12px', border: '1px solid var(--mg-input-border)', borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)' };
function Fld({ label, children }) { return <div style={{ marginBottom: 14 }}><label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', marginBottom: 7 }}>{label}</label>{children}</div>; }
function Sel({ ph }) { return <div style={selS}><span style={{ flex: 1, color: 'var(--c-muted)', fontSize: 14 }}>{ph}</span><i className="pi pi-chevron-down" style={{ fontSize: 12, color: 'var(--c-muted)' }} /></div>; }

/* ── Create Stage dialog ── */
function StageModal({ close }) {
  const [hidden, setHidden] = useState(false);
  const cols = ['#1D9E75','#378ADD','#EF9F27','#D4537E','#7F77DD','#FF5A44'];
  const [c, setC] = useState('#378ADD');
  return <Modal title="Новый этап" icon="pi-plus" close={close} width={440}
    footer={<React.Fragment><span style={{ flex: 1 }} /><button style={btn('ghost')} onClick={close}>Отмена</button><button style={btn('primary')} onClick={close}><i className="pi pi-check" style={{ fontSize: 12 }} />Создать</button></React.Fragment>}>
    <Fld label="Название этапа"><input className="inp" style={inpS} placeholder="Например: Презентация" /></Fld>
    <div style={{ display: 'flex', gap: 14 }}><div style={{ flex: 1 }}><Fld label="Тип этапа"><Sel ph="Обычный" /></Fld></div><div style={{ flex: 1 }}><Fld label="Родительский этап"><Sel ph="— (верхний уровень)" /></Fld></div></div>
    <Fld label="Цвет"><div style={{ display: 'flex', gap: 10 }}>{cols.map((x) => <span key={x} onClick={() => setC(x)} style={{ width: 28, height: 28, borderRadius: '50%', background: x, cursor: 'pointer', boxShadow: c === x ? '0 0 0 3px var(--c-card), 0 0 0 5px ' + x : 'none' }} />)}</div></Fld>
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 4, paddingTop: 14, borderTop: '1px solid var(--c-border)' }}><Switch on={hidden} onClick={() => setHidden(!hidden)} /><div><div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--c-text)' }}>Скрыт по умолчанию</div><div style={{ fontSize: 12, color: 'var(--c-muted)' }}>Этап не показывается на доске, пока не выбран в фильтре</div></div></div>
  </Modal>;
}

/* ── Automation wizard ── */
const ACTIONS = [['pi-check-square','Создать задачу','Поставить задачу ответственному'],['pi-envelope','Отправить сообщение','Письмo или Telegram клиенту'],['pi-user-edit','Сменить ответственного','Переназначить сделку'],['pi-bell','Уведомить','Оповестить менеджера/руководителя'],['pi-flag','Изменить поле','Проставить значение поля сделки']];
function AutoModal({ close }) {
  const [act, setAct] = useState(0);
  return <Modal title="Новая автоматизация" icon="pi-bolt" close={close} width={540}
    footer={<React.Fragment><span style={{ flex: 1 }} /><button style={btn('ghost')} onClick={close}>Отмена</button><button style={btn('primary')} onClick={close}><i className="pi pi-check" style={{ fontSize: 12 }} />Сохранить</button></React.Fragment>}>
    <Fld label="Триггер"><div style={{ ...selS, height: 'auto', padding: '11px 12px', gap: 10 }}><i className="pi pi-sign-in" style={{ color: 'var(--mg-primary-900)' }} /><span style={{ flex: 1, fontSize: 13.5, color: 'var(--c-text)' }}>Когда сделка попадает на этап <b>«Переговоры»</b></span></div></Fld>
    <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--c-text2)', margin: '4px 0 8px' }}>Действие</div>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 }}>
      {ACTIONS.map(([ic, t, s], i) => { const on = i === act; return <div key={i} onClick={() => setAct(i)} style={{ display: 'flex', gap: 11, padding: '12px', borderRadius: 'var(--mg-radius-md)', cursor: 'pointer', border: '1.5px solid ' + (on ? 'var(--mg-primary-900)' : 'var(--c-border)'), background: on ? 'var(--mg-primary-100)' : 'var(--c-card)' }}>
        <i className={'pi ' + ic} style={{ fontSize: 16, color: 'var(--mg-primary-900)', marginTop: 1 }} /><div style={{ minWidth: 0 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--c-text)' }}>{t}</div><div style={{ fontSize: 11.5, color: 'var(--c-muted)', marginTop: 1 }}>{s}</div></div></div>; })}
    </div>
    <div style={{ background: 'var(--c-hover)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-md)', padding: '14px 16px' }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--c-text2)', textTransform: 'uppercase', letterSpacing: '.04em', marginBottom: 10 }}>Параметры действия</div>
      <div style={{ display: 'flex', gap: 12 }}><div style={{ flex: 1 }}><Fld label="Что сделать"><input className="inp" style={inpS} defaultValue="Позвонить и согласовать условия" /></Fld></div><div style={{ width: 160 }}><Fld label="Срок"><Sel ph="+1 рабочий день" /></Fld></div></div>
      <Fld label="Ответственный"><Sel ph="Ответственный за сделку" /></Fld>
    </div>
  </Modal>;
}

function StageRow({ s, onAuto, sub }) {
  const [h, setH] = useState(false);
  return <div onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
    style={{ display: 'flex', alignItems: 'center', gap: 12, padding: sub ? '11px 14px 11px 40px' : '13px 14px', background: 'var(--c-card)', borderBottom: '1px solid var(--c-border)' }}>
    <i className="pi pi-bars" style={{ fontSize: 14, color: h ? 'var(--c-muted)' : 'var(--c-border2)', cursor: 'grab' }} />
    <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--c-text)' }}>{s.name}</span>
        {s.kind === 'Успех' && <span style={{ fontSize: 11, fontWeight: 600, padding: '2px 8px', borderRadius: 999, background: 'var(--mg-status-success-bg)', color: 'var(--mg-status-success-text)' }}>Успех</span>}
        {s.kind === 'Отказ' && <span style={{ fontSize: 11, fontWeight: 600, padding: '2px 8px', borderRadius: 999, background: 'var(--mg-status-danger-bg)', color: 'var(--mg-status-danger-text)' }}>Отказ</span>}
        {s.hidden && <span style={{ fontSize: 11, fontWeight: 500, padding: '2px 8px', borderRadius: 999, background: 'var(--c-hover)', color: 'var(--c-muted)' }}><i className="pi pi-eye-slash" style={{ fontSize: 10, marginInlineEnd: 4 }} />Скрыт</span>}
      </div>
      {s.autos && s.autos.length > 0 && <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>{s.autos.map(([ic, t], i) => <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11.5, fontWeight: 500, padding: '2px 8px', borderRadius: 'var(--mg-radius-sm)', background: 'color-mix(in srgb, var(--mg-primary-900) 10%, var(--c-card))', color: 'var(--mg-primary-900)' }}><i className={'pi ' + ic} style={{ fontSize: 11 }} />{t}</span>)}</div>}
    </div>
    {!sub && <span onClick={onAuto} title="Добавить автоматизацию" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12.5, fontWeight: 600, color: 'var(--mg-primary-900)', cursor: 'pointer', opacity: h ? 1 : 0.65 }}><i className="pi pi-bolt" style={{ fontSize: 12 }} />Автоматизация</span>}
    <i className="pi pi-pencil" style={{ fontSize: 13, color: 'var(--c-muted)', cursor: 'pointer', opacity: h ? 1 : 0, padding: 4 }} />
    <i className="pi pi-trash" style={{ fontSize: 13, color: 'var(--mg-status-danger-text)', cursor: 'pointer', opacity: h ? 1 : 0, padding: 4 }} />
  </div>;
}

function Canvas() {
  return <div style={{ flex: 1, overflow: 'auto', padding: '28px 24px', background: 'var(--c-page)' }}>
    <div style={{ display: 'flex', alignItems: 'stretch', gap: 0 }}>
      {STAGES.filter((s) => !s.hidden).map((s, i, arr) => <React.Fragment key={s.id}>
        <div style={{ width: 190, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderTop: '3px solid ' + s.color, borderRadius: 'var(--mg-radius-md)', boxShadow: 'var(--mg-shadow-sm)', padding: '12px 13px' }}>
            <div style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--c-text)' }}>{s.name}</div>
            <div style={{ fontSize: 11.5, color: 'var(--c-muted)', marginTop: 2 }}>{s.kind}</div>
          </div>
          {s.autos.map(([ic, t], k) => <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 7, background: 'color-mix(in srgb, var(--mg-primary-900) 8%, var(--c-card))', border: '1px dashed color-mix(in srgb, var(--mg-primary-900) 40%, var(--c-border))', borderRadius: 'var(--mg-radius-sm)', padding: '7px 9px', fontSize: 11.5, color: 'var(--mg-primary-900)', fontWeight: 500 }}><i className={'pi ' + ic} style={{ fontSize: 11 }} />{t}</div>)}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, border: '1px dashed var(--c-border2)', borderRadius: 'var(--mg-radius-sm)', padding: '6px', fontSize: 11.5, color: 'var(--c-muted)', cursor: 'pointer' }}><i className="pi pi-plus" style={{ fontSize: 10 }} />автоматизация</div>
        </div>
        {i < arr.length - 1 && <div style={{ display: 'flex', alignItems: 'center', padding: '0 2px', color: 'var(--c-border2)' }}><i className="pi pi-arrow-right" style={{ fontSize: 14 }} /></div>}
      </React.Fragment>)}
    </div>
  </div>;
}

function App() {
  const [pid, setPid] = useState(1);
  const [view, setView] = useState('form');
  const [dark, setDark] = useState(false);
  const [modal, setModal] = useState(null);
  const acc = dark ? '#4C7DF0' : '#172747';
  const pipe = PIPELINES.find((p) => p.id === pid);

  return <div className={'surface' + (dark ? ' dark' : '')} style={{ '--mg-primary-900': acc, '--mg-primary-800': dark ? '#6E99FF' : '#1f2f5a', '--mg-primary-100': dark ? 'rgba(76,125,240,0.16)' : undefined,
    height: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--c-page)', color: 'var(--c-text)' }}>
    {/* header */}
    <header style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 24px', background: 'var(--c-card)', borderBottom: '1px solid var(--c-border)', flexShrink: 0 }}>
      <span style={{ width: 38, height: 38, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><i className="pi pi-sliders-h" style={{ fontSize: 18, color: 'var(--mg-primary-900)' }} /></span>
      <div style={{ flex: 1 }}><h1 style={{ margin: 0, fontSize: 20, fontWeight: 600 }}>Воронка продаж</h1><p style={{ margin: '2px 0 0', fontSize: 13, color: 'var(--c-muted)' }}>Этапы и автоматизации · {pipe.name}</p></div>
      <div style={{ display: 'inline-flex', gap: 2, background: 'var(--mg-surface-muted)', borderRadius: 7, padding: 3 }}>
        {[['form','Форма','pi-list'],['canvas','Канвас','pi-sitemap']].map(([k, l, ic]) => { const on = view === k; return <button key={k} onClick={() => setView(k)} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 30, padding: '0 12px', border: 'none', borderRadius: 5, cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: 12.5, fontWeight: 600, background: on ? 'var(--c-card)' : 'transparent', color: on ? 'var(--mg-primary-900)' : 'var(--c-muted)', boxShadow: on ? 'var(--mg-shadow-sm)' : 'none' }}><i className={'pi ' + ic} style={{ fontSize: 13 }} />{l}</button>; })}
      </div>
      <button onClick={() => setDark(!dark)} style={{ ...btn('ghost'), width: 38, padding: 0, justifyContent: 'center' }}><i className={'pi ' + (dark ? 'pi-sun' : 'pi-moon')} style={{ fontSize: 15 }} /></button>
    </header>

    <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
      {/* pipelines rail */}
      <nav style={{ width: 250, flexShrink: 0, overflowY: 'auto', background: 'var(--c-card)', borderInlineEnd: '1px solid var(--c-border)', padding: '14px 10px', display: 'flex', flexDirection: 'column' }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.07em', textTransform: 'uppercase', color: 'var(--c-muted)', padding: '4px 8px 8px' }}>Воронки</div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2 }}>
          {PIPELINES.map((p) => { const on = p.id === pid; return <button key={p.id} onClick={() => setPid(p.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', border: 'none', borderRadius: 'var(--mg-radius-md)', cursor: 'pointer', textAlign: 'start', background: on ? 'var(--mg-primary-100)' : 'transparent', color: on ? 'var(--mg-primary-900)' : 'var(--c-text2)', boxShadow: on ? 'inset 3px 0 0 var(--mg-primary-900)' : 'none' }}>
            <i className="pi pi-filter" style={{ fontSize: 14, width: 16 }} /><span style={{ flex: 1, fontSize: 13.5, fontWeight: on ? 600 : 500 }}>{p.name}</span><span style={{ fontSize: 11.5, color: 'var(--c-muted)' }}>{p.stages}</span>
          </button>; })}
        </div>
        <button style={{ ...btn('ghost'), justifyContent: 'center', marginTop: 8 }}><i className="pi pi-plus" style={{ fontSize: 12 }} />Новая воронка</button>
      </nav>

      {/* editor */}
      {view === 'form' ? <div style={{ flex: 1, overflowY: 'auto', background: 'var(--c-page)', padding: '20px 24px' }}>
        <div style={{ maxWidth: 780, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
            <div><div style={{ fontSize: 16, fontWeight: 600 }}>Этапы воронки «{pipe.name}»</div><div style={{ fontSize: 13, color: 'var(--c-muted)', marginTop: 2 }}>Перетаскивайте для изменения порядка · подэтапы вложены</div></div>
            <button style={btn('primary')} onClick={() => setModal('stage')}><i className="pi pi-plus" style={{ fontSize: 12 }} />Этап</button>
          </div>
          <div style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden' }}>
            {STAGES.map((s) => <React.Fragment key={s.id}>
              <StageRow s={s} onAuto={() => setModal('auto')} />
              {s.subs && s.subs.map((ss) => <StageRow key={ss.id} s={ss} sub />)}
            </React.Fragment>)}
          </div>
          {/* automations summary */}
          <div style={{ marginTop: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>Автоматизации воронки</div>
            <button style={btn('ghost')} onClick={() => setModal('auto')}><i className="pi pi-bolt" style={{ fontSize: 12 }} />Добавить</button>
          </div>
          <div style={{ marginTop: 12, background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)', boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden' }}>
            {[['Переговоры','Задача менеджеру','pi-check-square',true],['Переговоры','Уведомление в Telegram','pi-telegram',true],['Презентация','Письмо с КП','pi-envelope',true],['Договор','Генерация договора','pi-file',false]].map(([st, nm, ic, active], i) => <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '13px 16px', borderBottom: i < 3 ? '1px solid var(--c-border)' : 'none' }}>
              <span style={{ width: 32, height: 32, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><i className={'pi ' + ic} style={{ fontSize: 14, color: 'var(--mg-primary-900)' }} /></span>
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--c-text)' }}>{nm}</div><div style={{ fontSize: 12, color: 'var(--c-muted)', marginTop: 1 }}>При входе на этап «{st}»</div></div>
              <Switch on={active} onClick={() => {}} />
            </div>)}
          </div>
        </div>
      </div> : <Canvas />}
    </div>
    {modal === 'stage' && <StageModal close={() => setModal(null)} />}
    {modal === 'auto' && <AutoModal close={() => setModal(null)} />}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
