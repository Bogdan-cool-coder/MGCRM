['task', 'Задача', 'pi-check-square'], ['note', 'Заметка', 'pi-pencil']];

  note: 'Выплачивается в следующем месяце за текущим' },
{ icon: 'pi-percentage', name: 'Комиссия с продаж', tag: '5%', planInd: '7 500 000 ₸', factInd: '8 420 000 ₸', salPlan: '150 000 ₸', salFact: '168 400 ₸', pct: 112,

  breakdown: [['Сделка #4771 (BI)', '≈ 2 900 000 ₸'], ['Сделка #4790 (ERP)', '3 000 000 ₸']] },
{ icon: 'pi-chart-bar', name: 'Онбординг-курс пройден', manual: true, manualDone: true, salPlan: '15 000 ₸', salFact: '15 000 ₸', pct: null },
{ icon: 'pi-star', name: 'Бонус за квартал', tag: null, planInd: '—', factInd: '—', salPlan: '0 ₸', salFact: '25 400 ₸', pct: null },
{ icon: 'pi-users', name: 'Командный бонус', tag: null, planInd: '—', factInd: '—', salPlan: '0 ₸', salFact: '0 ₸', pct: null,
  note: 'Начисляется при выполнении плана отдела ≥ 85%' }];

const MK_MONTHS = ['Июль 2026', 'Июнь 2026', 'Май 2026', 'Апрель 2026', 'Март 2026', 'Февраль 2026'];
const OV_MONTHS = ['Июль 2026', 'Июнь 2026', 'Май 2026', 'Апрель 2026', 'Март 2026', 'Февраль 2026', 'Январь 2026'];
const MEMBERS = ['Богдан Меркулов', 'Игорь Волков', 'Алина Сергеева', 'Дамир Ахметов', 'Ольга Ким', 'Рустам Ниязов'];
const MOOD_PHRASES = {
  happy: ['Ты выше плана — так держать!', 'Отличный темп, продолжай!', 'План побит — ты в ударе!', 'Так держать, лидер команды!'],
  ok: ['Почти у цели — поднажми!', 'Ещё чуть-чуть до плана!', 'Хороший ход, добери разрыв!', 'Ты близко — финишируй месяц!'],
  low: ['Есть куда расти — вперёд!', 'Соберись, всё получится!', 'Небольшой рывок — и догонишь!', 'Начни с одной сделки сегодня!']
};

/* ═══════════════════════════ helpers ═══════════════════════════ */
/* тихий цвет: зелёный только «в плюсе», приглушённый серый / красный — вне плана */
function pctColor(v) {return v == null ? 'var(--c-muted)' : v >= 100 ? 'var(--mg-green-900)' : v >= 80 ? 'var(--c-text2)' : 'var(--mg-red-700)';}
function Pct({ v, size }) {
  if (v == null) return <span style={{ fontSize: (size || 13) + 'px', color: 'var(--c-muted)' }}>—</span>;
  return <span style={{ fontSize: (size || 13) + 'px', fontWeight: 700, color: pctColor(v), fontVariantNumeric: 'tabular-nums' }}>{v}%</span>;
}
function Avatar({ name, size = 44, tone }) {
  const init = name.trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
  return <span style={{ width: size, height: size, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    fontSize: size * 0.36, fontWeight: 700, background: tone === 'solid' ? 'var(--mg-primary-900)' : 'var(--mg-primary-100)',
    color: tone === 'solid' ? '#fff' : 'var(--mg-primary-900)' }}>{init}</span>;
}
function Panel({ children, style, pad }) {
  return <section style={{ background: 'var(--c-card)', border: '1px solid var(--c-border)', borderRadius: 'var(--mg-radius-lg)',
    boxShadow: 'var(--mg-shadow-sm)', overflow: 'hidden', ...style }}><div style={{ padding: pad ?? '18px 20px' }}>{children}</div></section>;
}
function Eyebrow({ children, style }) {
  return <span style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--c-muted)', ...style }}>{children}</span>;
}
/* курсы валют — тихая иконка-подсказка вместо оранжевой плашки */
function CcyNote({ inline }) {
  return <i className="pi pi-info-circle" title="Суммы приведены к базовой валюте (₸); сделки без курса валют не учтены. Курсы валют — в Каталоге."
  style={{ fontSize: '11px', color: 'var(--c-muted)', cursor: 'help', marginLeft: inline ? 6 : 0 }} />;
}
function usePop() {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const h = (e) => {if (ref.current && !ref.current.contains(e.target)) setOpen(false);};
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);
  return [open, setOpen, ref];
}
function IconBtn({ icon, onClick, disabled }) {
  const [h, setH] = useState(false);
  return <button onClick={disabled ? undefined : onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
  style={{ width: 32, height: 32, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', borderRadius: 'var(--mg-radius-md)',
    border: '1px solid var(--c-border2)', background: h && !disabled ? 'var(--c-hover)' : 'transparent', color: 'var(--c-text2)',
    cursor: disabled ? 'default' : 'pointer', opacity: disabled ? 0.4 : 1 }}><i className={'pi ' + icon} style={{ fontSize: '12px' }} /></button>;
}
/* progress ring (only circles/svg — allowed) */
function Ring({ pct, size = 104, stroke = 9, color }) {
  const r = (size - stroke) / 2,c = 2 * Math.PI * r,val = Math.max(0, Math.min(pct, 100));
  return <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
    <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--c-hover)" strokeWidth={stroke} />
    <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
    strokeDasharray={c} strokeDashoffset={c * (1 - val / 100)} style={{ transition: 'stroke-dashoffset .5s ease' }} /></svg>;
}
function InfoI({ text }) {
  return <i className="pi pi-info-circle" title={text} style={{ fontSize: '11px', color: 'var(--c-muted)', cursor: 'help', marginLeft: 5 }} />;
}
/* мотивационная «голова»: мимика + фраза по проценту выполнения плана */
function MoodHead({ score }) {
  const mood = score >= 100 ? 'happy' : score >= 80 ? 'ok' : 'low';
  const col = mood === 'happy' ? 'var(--mg-green-700)' : mood === 'ok' ? 'var(--mg-primary-900)' : 'var(--mg-orange-700)';
  const phrases = MOOD_PHRASES[mood];
  const [i, setI] = useState(0);
  useEffect(() => {setI(0);const t = setInterval(() => setI((x) => (x + 1) % phrases.length), 4200);return () => clearInterval(t);}, [mood]);
  const mouth = mood === 'happy' ? 'M17 29 Q26 39 35 29' : mood === 'low' ? 'M17 34 Q26 25 35 34' : 'M18 31 L34 31';
  const word = mood === 'happy' ? 'выше плана' : mood === 'ok' ? 'в графике' : 'ниже плана';
  return <div style={{ display: 'flex', alignItems: 'center', gap: '13px' }}>
    <svg width="54" height="54" viewBox="0 0 52 52" style={{ flexShrink: 0 }}>
      <circle cx="26" cy="26" r="23" fill="var(--mg-primary-100)" stroke={col} strokeWidth="2" />
      <circle cx="19" cy="22" r="2.4" fill={col} /><circle cx="33" cy="22" r="2.4" fill={col} />
      <path d={mouth} fill="none" stroke={col} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
    <div style={{ minWidth: 0 }}>
      <div style={{ fontSize: '15px', fontWeight: 700, color: col }}>{word}</div>
      <div onClick={() => setI((x) => (x + 1) % phrases.length)} title="Ещё фраза"
      style={{ fontSize: '12px', color: 'var(--c-text2)', marginTop: '3px', maxWidth: 176, cursor: 'pointer' }}>{phrases[i]}</div>
    </div>
  </div>;
}

/* ═══════════════════════════ OVERVIEW: quiet toolbar ═══════════════════════════ */
function UserPicker({ viewed, setViewed }) {
  const [open, setOpen, ref] = usePop();
  const [q, setQ] = useState('');
  const list = MEMBERS.filter((m) => m.toLowerCase().includes(q.toLowerCase()));
  return <div ref={ref} style={{ position: 'relative', minWidth: 210 }}>
    <div onClick={() => setOpen((o) => !o)} style={{ display: 'flex', alignItems: 'center', gap: '8px', height: 34, padding: '0 9px 0 11px',
      border: '1px solid ' + (open ? 'var(--mg-primary-900)' : 'var(--c-border2)'), borderRadius: 'var(--mg-radius-md)', background: 'var(--c-card)', cursor: 'pointer' }}>
      <i className="pi pi-user" style={{ fontSize: '13px', color: 'var(--c-muted)' }} />
      <span style={{ flex: 1, fontSize: '13px', color: viewed ? 'var(--c-text)' : 'var(--c-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{viewed || 'Мой кабинет'}</span>
      {viewed && <i className="pi pi-times" onClick={(e) => {e.stopPropagation();setViewed(null);}} title="Сбросить" style={{ fontSize: '11px', color: 'var(--c-muted)', padding: '3px' }} />}
      <i className="pi pi-chevron-down" style={{ fontSize: '10px', color: 'var(--c-muted)' }} />
    </div>
    {open && <div style={{ position: 'absolute', top: 40, left: 0, right: 0, zIndex: 40, background: 'var(--c-card)', border: '1px solid var(--c-border)',
      borderRadius: 'var(--mg-radius-md)', boxShadow: 'var(--mg-shadow-lg)', padding: '6px', maxHeight: 280, overflowY: 'auto' }}>
      <div style={{ position: 'relative', marginBottom: '6px' }}>
        <i className="pi pi-search" style={{ position: 'absolute', left: 9, top: '50%', transform: 'translateY(-50%)', fontSize: '12px', color: 'var(--c-muted)' }} />
        <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск сотрудника…"
        style={{ width: '100%', height: 32, padding: '0 10px 0 28px', border: '1px solid var(--c-border2)', borderRadius: 'var(--mg-radius-sm)',
          background: 'var(--c-card)', fontFamily: 'var(--mg-font-sans)', fontSize: '13px', color: 'var(--c-text)' }} />
      </div>
      {list.map((m) => {
        const on = m === viewed;
        return <button key={m} onClick={() => {setViewed(m);setOpen(false);setQ('');}} style={{ display: 'flex', alignItems: 'center', gap: '9px', width: '100%',
          background: on ? 'var(--mg-primary-100)' : 'transparent', border: 'none', cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', padding: '7px 8px',
          borderRadius: 'var(--mg-radius-sm)', textAlign: 'left' }} onMouseEnter={(e) => {if (!on) e.currentTarget.style.background = 'var(--c-hover)';}}
        onMouseLeave={(e) => {if (!on) e.currentTarget.style.background = 'transparent';}}>
          <Avatar name={m} size={26} />
          <span style={{ flex: 1, fontSize: '13px', fontWeight: on ? 600 : 500, color: on ? 'var(--mg-primary-900)' : 'var(--c-text)' }}>{m}</span>
          {on && <i className="pi pi-check" style={{ fontSize: '12px', color: 'var(--mg-primary-900)' }} />}</button>;
      })}
      {list.length === 0 && <div style={{ fontSize: '12px', color: 'var(--c-muted)', padding: '8px' }}>Ничего не найдено</div>}
    </div>}
  </div>;
}

/* ═══════════════════════════ OVERVIEW: results (hero МК% + team) ═══════════════════════════ */
function SecStat({ label, value, sub, ccy, hint }) {
  return <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', padding: '11px 0', borderTop: '1px solid var(--c-border)' }}>
    <span style={{ fontSize: '13px', color: 'var(--c-text2)', display: 'inline-flex', alignItems: 'center' }}>{label}{hint && <InfoI text={hint} />}</span>
    <span style={{ textAlign: 'right' }}>
      <span style={{ fontSize: '15px', fontWeight: 700, color: 'var(--c-text)', fontVariantNumeric: 'tabular-nums' }}>{value}</span>
      {ccy && <CcyNote inline />}
      {sub && <span style={{ display: 'block', fontSize: '11px', color: 'var(--c-muted)', marginTop: '1px' }}>{sub}</span>}
    </span></div>;
}
function ResultsHero({ name, empty }) {
  if (empty) return <Panel><div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', padding: '30px' }}>
    <i className="pi pi-chart-pie" style={{ fontSize: '28px', color: 'var(--c-muted)' }} />
    <span style={{ fontSize: '13px', color: 'var(--c-muted)' }}>Данные KPI недоступны</span></div></Panel>;
  const score = KPI.scorePct;
  const ringCol = score >= 100 ? 'var(--mg-green-700)' : score >= 80 ? 'var(--mg-primary-900)' : 'var(--mg-red-600)';
  return <Panel pad="0" style={{ height: '100%' }}>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr' }}>
      {/* KPIs */}
      <div style={{ padding: '18px 20px' }}>
        <Eyebrow>Результаты · {MK.period}</Eyebrow>
        <div style={{ display: 'flex', alignItems: 'center', gap: '18px', margin: '14px 0 6px' }}>
          <div style={{ position: 'relative', width: 104, height: 104, flexShrink: 0 }}>
            <Ring pct={KPI.hasPlan ? score : 0} color={ringCol} />
            <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ fontSize: '26px', fontWeight: 700, color: 'var(--c-text)', lineHeight: 1 }}>{KPI.hasPlan ? score + '%' : '—'}</span>
              <span style={{ fontSize: '10px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--c-muted)', marginTop: '2px' }}>МК%</span>
            </div>
          </div>
          <MoodHead score={score} />
        </div>
        <SecStat label="Личные продажи" value={KPI.incomeFact} sub={'план ' + KPI.incomePlan} ccy />
        <SecStat label="Первичные встречи" hint="Первая встреча с новым клиентом (First-Time Meeting). Зачитывается автоматически при проведении встречи с компанией, у которой ранее встреч не было." value={KPI.ftmFact + ' / ' + KPI.ftmPlan} sub="зачтённых встреч" />
        <SecStat label="Ранг в команде" hint="Место по проценту выполнения мотивационной карты (МК%) среди сотрудников отдела за выбранный месяц. #1 — лучший результат." value={'#' + KPI.rank + ' из ' + KPI.size} sub={'среднее ' + KPI.avg + '%'} />
      </div>
      {/* team */}
      <div style={{ padding: '18px 20px', borderLeft: '1px solid var(--c-border)' }}><TeamList empty={empty} /></div>
    </div>
  </Panel>;
}
function TeamList({ empty }) {
  if (empty) return <><Eyebrow>Команда</Eyebrow><div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px', padding: '24px' }}>
    <i className="pi pi-users" style={{ fontSize: '24px', color: 'var(--c-muted)' }} />
    <span style={{ fontSize: '13px', color: 'var(--c-muted)' }}>Вы единственный в отделе</span></div></>;
  const max = 120;
  return <>
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
      <Eyebrow>Команда</Eyebrow><span style={{ fontSize: '12px', color: 'var(--c-muted)' }}>среднее {KPI.avg}%</span></div>
    <div style={{ marginTop: '12px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
      {TEAM.map((m) => <div key={m.name} style={{ display: 'grid', gridTemplateColumns: '1fr 76px 42px', alignItems: 'center', gap: '10px' }}>

  const [monthIdx, setMonthIdx] = useState(0);
  const dark = t.dark;
  const ACC = { '#172747': '#1f2f5a', '#2b2f36': '#3a3f47', '#312e81': '#3f3a9e', '#0f4d3a': '#13654c' };
  const accent = dark ? '#4C7DF0' : t.accent;
  const accentHover = dark ? '#6E99FF' : ACC[t.accent] || '#1f2f5a';
  const TABS = [['overview', 'Кабинет менеджера'], ['motivation', 'Мотивационная карта']];
  return <div className={'surface' + (dark ? ' dark' : '')} style={{ '--mg-primary-900': accent, '--mg-primary-800': accentHover,
    height: '100vh', display: 'flex', flexDirection: 'column', position: 'relative', background: 'var(--c-board)' }}>
    <header style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '14px 22px', borderBottom: '1px solid var(--c-border)', background: 'var(--c-card)', flexShrink: 0, flexWrap: 'wrap' }}>
      <span style={{ width: 38, height: 38, borderRadius: 'var(--mg-radius-md)', background: 'var(--mg-primary-100)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        <i className="pi pi-id-card" style={{ fontSize: '17px', color: 'var(--mg-primary-900)' }} /></span>
      <div>
        <h1 style={{ fontSize: '19px', fontWeight: 600, color: 'var(--c-text)', margin: 0, lineHeight: 1.1 }}>Кабинет менеджера</h1>
        <div style={{ fontSize: '12px', color: 'var(--c-muted)', marginTop: '2px' }}>{PROFILE.name} · Отдел продаж</div>
      </div>
      <span style={{ flex: 1, minWidth: 12 }} />
      {t.admin && <div style={{ minWidth: 210 }}><UserPicker viewed={viewed} setViewed={setViewed} /></div>}
      <span style={{ display: 'inline-flex', gap: '2px', background: 'var(--mg-gray-100)', borderRadius: '9px', padding: '3px' }}>
        {TABS.map(([v, l]) => <button key={v} onClick={() => setTab(v)} style={{ border: 'none', cursor: 'pointer', fontFamily: 'var(--mg-font-sans)', fontSize: '13px',
          fontWeight: 600, padding: '7px 15px', borderRadius: '6px', background: tab === v ? 'var(--c-card)' : 'transparent',
          color: tab === v ? 'var(--mg-primary-900)' : 'var(--c-muted)', boxShadow: tab === v ? 'var(--mg-shadow-sm)' : 'none', transition: 'all .12s' }}>{l}</button>)}
      </span>
      <MonthNav months={MK_MONTHS} idx={monthIdx} setIdx={setMonthIdx} noArrows />
    </header>
    <div style={{ flex: 1, overflowY: 'auto', padding: '20px 22px', minHeight: 0 }}>
      {tab === 'overview' ? <OverviewTab empty={t.empty} viewed={viewed} /> : <MotivationTab empty={t.empty} idx={monthIdx} />}
    </div>
    <TweaksPanel title="Tweaks">
      <TweakSection label="Бренд" />
      <TweakColor label="Акцент" value={t.accent} options={['#172747', '#2b2f36', '#312e81', '#0f4d3a']} onChange={(v) => setTweak('accent', v)} />
      <TweakSection label="Полотно" />
      <TweakToggle label="Тёмная тема" value={t.dark} onChange={(v) => setTweak('dark', v)} />
      <TweakSection label="Демонстрация" />
      <TweakToggle label="Роль: админ / директор" value={t.admin} onChange={(v) => setTweak('admin', v)} />
      <TweakToggle label="Пустые состояния" value={t.empty} onChange={(v) => setTweak('empty', v)} />
    </TweaksPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
