# Dev stack — full local development environment (one-command startup).
#
# USAGE:
#   docker compose -f docker-compose.dev.yml up -d
#
# Services started:
#   db        — postgres:16-alpine  (port 5432)
#   redis     — redis:7-alpine      (port 6379)
#   app       — php-fpm 8.5 with bind-mount ./src (live code, dev-deps installed)
#   nginx     — proxies /api → app:9000, serves Laravel public/
#   frontend  — Vite dev server (port 5173), proxies /api → nginx:80
#
# Key differences from docker-compose.yml (prod):
#   - app: bind-mounts ./src so changes are live without rebuild
#   - app: composer install --dev (includes Pint, PHPUnit, Pail)
#   - app: opcache.validate_timestamps=1 (reloads changed files)
#   - frontend: runs `vite` (HMR) instead of a static nginx build
#   - No gotenberg, queue-worker, scheduler, reverb on startup — start on demand:
#       docker compose -f docker-compose.dev.yml --profile worker up -d   # queue-worker + scheduler (M7 automation)
#       docker compose -f docker-compose.dev.yml up -d gotenberg          # PDF generation
#       docker compose -f docker-compose.dev.yml up -d reverb             # realtime WebSocket server
#
# Reverb wiring (dev):
#   - src/.env REVERB_HOST must be the service name `reverb` (app/queue-worker
#     publish events to it over the compose network, e.g. reverb:8080 —
#     NOT localhost, which only works if reverb runs on the bare host).
#   - VITE_REVERB_HOST must be a browser-reachable host (e.g. `localhost`,
#     since the reverb port below is published to 127.0.0.1:6001). This is a
#     DIFFERENT value than REVERB_HOST in dev — do not mirror one into the
#     other like prod does (prod resolves both via Traefik/nginx path-routing;
#     dev has no such proxy in front of the Vite dev server for WebSockets).
#   - front/.env.local (Vite env, not docker env) needs VITE_REVERB_HOST=localhost
#     + VITE_REVERB_PORT=6001 — Vite's dev proxy only forwards /api, not
#     WebSocket upgrades, so Echo connects straight to the published host port.
#
# After first start run migrations + seed (wait ~30s for composer install to finish):
#   docker compose -f docker-compose.dev.yml exec app php artisan migrate --force
#   docker compose -f docker-compose.dev.yml exec app php artisan db:seed --force
#
# Run tests (sqlite :memory:, never touches the live db):
#   docker compose -f docker-compose.dev.yml exec app php artisan test

networks:
  macro-crm-dev:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Postgres 16 — primary datastore.
  # Service name matches src/.env DB_HOST=postgres so no env override needed.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-db-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-macro_crm}
      POSTGRES_USER: ${DB_USERNAME:-macro_crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - macro-crm-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-macro_crm} -d ${DB_DATABASE:-macro_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — queue + cache backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - macro-crm-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # App (PHP-FPM 8.5) — bind-mount of ./src for live code, dev-deps installed.
  #
  # The prod Dockerfile bakes code into the image (--no-dev vendor).
  # For dev we mount ./src directly and install ALL composer deps (including
  # Pint, PHPUnit, Pail) so `docker compose exec app ...` works out of the box.
  #
  # opcache.validate_timestamps=1 ensures PHP picks up changes on each request
  # without a container restart (at the cost of a small stat overhead — fine for dev).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-app-dev
    restart: unless-stopped
    env_file:
      - src/.env
    environment:
      # Override prod-baked opcache setting: validate file timestamps in dev
      # so changed PHP files are picked up without container restart.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    volumes:
      # Bind-mount: live source (no rebuild on code change)
      - ./src:/var/www/html
      # Named volume for storage so it persists across bind-mount resets
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      # vendor/ in a named volume: survives host `src/vendor` git-ignored dir
      # and avoids macOS performance hit from bind-mounting node_modules-sized dirs.
      - vendor_dev:/var/www/html/vendor
      # bootstrap/cache in a volume so artisan optimize runs persist
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Nginx — serves Laravel public/ and proxies PHP to app:9000.
  # Reuses the same config as prod (docker/nginx/default.conf).
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-nginx-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Bind-mount public/ so nginx can serve favicon, robots.txt etc. from live source
      - ./src/public:/var/www/html/public:ro
    networks:
      - macro-crm-dev
    depends_on:
      - app

  # ---------------------------------------------------------------------------
  # Frontend — Vite HMR dev server.
  # Proxies /api requests to nginx:80 (configured in front/vite.config.ts).
  # Access the SPA at http://localhost:5173
  # ---------------------------------------------------------------------------
  frontend:
    image: node:22-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-frontend-dev
    restart: unless-stopped
    working_dir: /app
    # install if node_modules is missing/stale, then start vite with --host so
    # the dev server binds to 0.0.0.0 and is reachable from the host.
    command: sh -c "npm ci && npm run dev -- --host"
    environment:
      # Enable chokidar polling so Vite detects file changes from macOS host
      # bind-mounts on colima/virtiofs where inotify events are not delivered.
      # 300 ms interval is set in vite.config.ts when this flag is present.
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Bind-mount front/ so file changes trigger HMR without rebuild
      - ./front:/app
      # node_modules in a named volume: avoids macOS host-filesystem slowness
      # and macOS/Linux uid mismatch on the bind mount.
      - node_modules_dev:/app/node_modules
    networks:
      - macro-crm-dev
    depends_on:
      - nginx

  # ---------------------------------------------------------------------------
  # Queue worker — optional, start manually when needed:
  #   docker compose -f docker-compose.dev.yml --profile worker up -d queue-worker
  #
  # Queue priority: default first (user-facing jobs) then automation (background scans).
  # ExecuteAutomationActionJob (M7) is dispatched to queue=automation and processed here.
  # ---------------------------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-queue-dev
    command: php artisan queue:work --queue=default,automation --tries=1 --timeout=600 --max-jobs=50 --memory=256 --sleep=1
    restart: unless-stopped
    profiles:
      - worker
    env_file:
      - src/.env
    volumes:
      - ./src:/var/www/html
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Scheduler — runs `php artisan schedule:work` so cron commands fire locally.
  #
  # M7 automation commands covered:
  #   automation:scan-idle        (hourly, withoutOverlapping)
  #   automation:scan-date-field  (hourly, withoutOverlapping)
  #
  # Optional profile `worker` — start alongside queue-worker:
  #   docker compose -f docker-compose.dev.yml --profile worker up -d
  #
  # SINGLE process: schedule:work polls every 60s. DO NOT scale.
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-scheduler-dev
    command: php artisan schedule:work
    restart: unless-stopped
    profiles:
      - worker
    env_file:
      - src/.env
    volumes:
      - ./src:/var/www/html
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Telegram bot (S2.9) — long-polling, SINGLE process. Optional profile `bot`:
  #   docker compose -f docker-compose.dev.yml --profile bot up -d bot
  #
  # NEVER scale this service (parallel getUpdates → Telegram 409 Conflict).
  # RUN_TELEGRAM_POLLING=true is set ONLY here; app/queue do not poll.
  # nutgram:listen (auto-reload) can be substituted for nutgram:run in dev.
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-bot-dev
    command: php artisan nutgram:run
    restart: unless-stopped
    profiles:
      - bot
    env_file:
      - src/.env
    environment:
      RUN_TELEGRAM_POLLING: "true"
    volumes:
      - ./src:/var/www/html
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ---------------------------------------------------------------------------
  # SalesPulse bot (dev) — second bot, own token. Opt-in via the `bot` profile:
  #   docker compose -f docker-compose.dev.yml --profile bot up -d salespulse-bot
  #
  # NEVER scale (parallel getUpdates on the SalesPulse token → 409 Conflict).
  # SALESPULSE_RUN_POLLING=true is set ONLY here. Empty token → FakeNutgram (idle).
  # ---------------------------------------------------------------------------
  salespulse-bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-salespulse-bot-dev
    command: php artisan salespulse:run
    restart: unless-stopped
    profiles:
      - bot
    env_file:
      - src/.env
    environment:
      SALESPULSE_RUN_POLLING: "true"
    volumes:
      - ./src:/var/www/html
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Gotenberg — PDF generation. Optional, start manually when needed:
  #   docker compose -f docker-compose.dev.yml up -d gotenberg
  # ---------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-gotenberg-dev
    restart: unless-stopped
    profiles:
      - gotenberg
    networks:
      - macro-crm-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Reverb — Laravel WebSocket server (long-running, single process).
  # Mirrors the prod `reverb` service (docker-compose.yml) on the same PHP
  # image family, but built from Dockerfile.dev + bind-mount, like the other
  # dev worker services (queue-worker/scheduler/bot).
  #
  # Port is published to the host so the browser (Vite dev server has no
  # WebSocket proxy) can connect directly — see the file-header note above
  # on the REVERB_HOST vs VITE_REVERB_HOST split.
  #
  # Start manually when realtime features need to be exercised:
  #   docker compose -f docker-compose.dev.yml up -d reverb
  #
  # No healthcheck-less long-worker pattern here on purpose — reverb has no
  # HTTP health endpoint on 8080 (same TCP-probe reasoning as prod's reverb
  # service; see docker-compose.yml comment above the prod block).
  # ---------------------------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    image: macro-crm-app-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-macro-crm}-reverb-dev
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    profiles:
      - reverb
    ports:
      # 6001 (not 8080) on the host — dev's `nginx` service already publishes
      # 8080 for the API. 6001 is Laravel Reverb's own conventional local
      # dev port; the container-internal port stays 8080 to match prod.
      - "127.0.0.1:${REVERB_HOST_PORT:-6001}:8080"
    env_file:
      - src/.env
    volumes:
      - ./src:/var/www/html
      - storage_app_dev:/var/www/html/storage/app
      - storage_framework_dev:/var/www/html/storage/framework
      - storage_logs_dev:/var/www/html/storage/logs
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
    networks:
      - macro-crm-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',8080)?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redis_dev_data:
  storage_app_dev:
  storage_framework_dev:
  storage_logs_dev:
  bootstrap_cache_dev:
  vendor_dev:
  node_modules_dev:
